<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1416">
<title>Atlante del Cinema</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
:root{
  --ink:#0F1416; --s1:#172024; --s2:#1E2A2F; --s3:#26353B; --line:#2C3A40; --paper:#ECE7DC; --paper2:#B5B0A4; --paper3:#857F74;
  --chart:#8FB8C9; --chart2:#5E8B9E; --amber:#E9A23B; --amber2:#F5C26B; --pos:#6CC48F; --neg:#F07A6E; --mix:#E2C04A;
  --serif:-apple-system, BlinkMacSystemFont, 'Inter Atlante', 'Segoe UI Variable Display', 'Segoe UI', Roboto, Arial, sans-serif;   /* titoli: San Francisco sui dispositivi Apple, altrove Inter */
  --ui:-apple-system, BlinkMacSystemFont, 'Inter Atlante', 'Segoe UI Variable Text', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
}
@font-face{font-family:'Inter Atlante'; src:url('fonts/inter-var.woff2') format('woff2-variations'), url('fonts/inter-var.woff2') format('woff2'); font-weight:100 900; font-style:normal; font-display:swap;}   /* Inter, SIL Open Font License: fonts/OFL.txt */
*,*::before,*::after{box-sizing:inherit;}
body{margin:0; background:var(--ink); color:var(--paper); font-family:var(--ui); font-size:15px; line-height:1.5;}
a{color:inherit; text-decoration:none;}
button, input, select{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--chart); outline-offset:2px;}
.hidden{display:none !important;}
.lnk{color:var(--chart); cursor:pointer;} .lnk:hover{text-decoration:underline;} .fr .sub .lnk, .tile .ty .lnk{color:inherit; text-decoration:underline; text-decoration-color:rgba(143,184,201,.45); text-underline-offset:2px;}
.rate-wrap{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0 2px;} .rate{display:flex; gap:4px; flex-wrap:wrap;}
.rate button{width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:var(--s2); cursor:pointer; font-weight:700; font-size:13px;}
.rate button[aria-pressed="true"]{background:var(--amber); border-color:var(--amber); color:#1d1406;}
.poster.pphoto{border-radius:50%; aspect-ratio:1; width:200px; max-width:100%; align-items:center; justify-content:center; padding:0;} .poster.pphoto .tt{font-size:42px; color:var(--paper3);}   /* tondo: più specifico di .poster */
.rk-list{display:flex; flex-direction:column; border-top:1px solid var(--line); margin-bottom:16px;}
.rk{display:grid; grid-template-columns:40px 34px minmax(0, 1fr) auto; gap:12px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line);}
.rk .rk-n{font-family:var(--serif); font-weight:700; font-size:22px; text-align:center; color:var(--amber2);} .rk .th{width:34px; height:51px; object-fit:cover; border-radius:3px; background:var(--s2); display:block;}
.rk .sub{display:block; color:var(--paper2); font-size:13px;} .rk-a{display:flex; gap:6px;} .rk-a .btn{height:32px; padding:0 10px;} .rk-a .btn:disabled{opacity:.35; cursor:default;}
/* ---------- 📺 Modalità TV: da leggere dal divano, con il telecomando ---------- */
html.tv{font-size:20px;}
html.tv body{font-size:20px;}
html.tv .top{backdrop-filter:none; background:var(--ink);}
html.tv .top-in, html.tv main{max-width:none; padding-left:5vw; padding-right:5vw;}   /* margini di sicurezza ai bordi */
html.tv main{padding-top:3vh; padding-bottom:6vh;}
html.tv .nav a{font-size:19px; padding:10px 16px;}
html.tv .search input{height:52px; font-size:20px;}
html.tv h1.pg{font-size:46px;} html.tv h2.sec{font-size:28px; margin-top:34px;}
html.tv .strip{grid-auto-columns:minmax(200px, 220px); gap:18px; padding:10px 8px 14px; scroll-snap-type:none;}
html.tv .tiles{grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));}
html.tv .tile .tt{font-size:22px;} html.tv .tile .ty, html.tv .tile .tb{font-size:16px;}
html.tv .fr{grid-template-columns:70px 46px minmax(0, 1fr) auto; padding:14px 8px;} html.tv .fr .th{width:46px; height:69px;}
html.tv .fr b{font-size:22px;} html.tv .fr .sub{font-size:17px;} html.tv .fr .sc{font-size:26px;}
html.tv .btn{height:52px; padding:0 22px; font-size:19px; border-radius:26px;}
html.tv .rate button{width:46px; height:46px; font-size:18px;}
html.tv .genre{padding:20px; font-size:21px;} html.tv .person{padding:16px;}
html.tv .kv{grid-template-columns:220px minmax(0, 1fr); font-size:18px;} html.tv .plot{font-size:21px;}
html.tv .ruler{height:200px;} html.tv .ruler .yr{font-size:16px;}
html.tv :focus{outline:none;}
html.tv a:focus, html.tv button:focus, html.tv input:focus, html.tv select:focus{outline:5px solid var(--amber); outline-offset:4px; border-radius:8px;}
html.tv .tile:focus, html.tv .genre:focus, html.tv .person:focus{transform:scale(1.07); box-shadow:0 10px 30px rgba(0,0,0,.6); z-index:2; position:relative;}
html.tv .fr:focus, html.tv .rk a:focus{background:var(--s2);}
html.tv .tile, html.tv .genre, html.tv .person{transition:transform .12s ease-out;}
html.tv .tile .tp{will-change:auto;}
/* ---------- Tipografia in stile Apple TV: titoli grassi e compatti, numeri in colonna ---------- */
body{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; font-optical-sizing:auto; letter-spacing:-0.003em;}
.brand b{font-weight:800; letter-spacing:-0.025em;}
h1.pg{font-weight:800; letter-spacing:-0.03em; line-height:1.05;}
h2.sec{font-weight:700; letter-spacing:-0.02em; font-size:22px;}
.box h3{font-weight:700; letter-spacing:-0.012em;}
.tile .tt, .poster .tt{font-weight:750; letter-spacing:-0.018em;}
.fr b{font-weight:650; letter-spacing:-0.012em;}
.fr em{font-style:normal; color:var(--paper3); font-weight:500;}
.orig{font-style:normal; font-weight:500; letter-spacing:-0.01em;}
.fr .sc, .score b, .rk .rk-n{font-weight:750; letter-spacing:-0.025em; font-variant-numeric:tabular-nums;}
.genre{font-weight:700; letter-spacing:-0.012em;} .person b{font-weight:650; letter-spacing:-0.01em;}
.plot{font-family:var(--ui); font-size:17px; line-height:1.62;}
.nav a{letter-spacing:-0.005em;} .lead{letter-spacing:-0.006em;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ---------- Testata ---------- */
.top{position:sticky; top:0; z-index:30; background:rgba(15,20,22,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
.top-in{max-width:1180px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:12px 18px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; white-space:nowrap;}
.brand .rose{width:28px; height:28px; border:1.5px solid var(--chart); border-radius:50%; position:relative;}
.brand .rose::before, .brand .rose::after{content:""; position:absolute; left:50%; top:50%; background:var(--amber); transform:translate(-50%,-50%) rotate(45deg);}
.brand .rose::before{width:3px; height:20px;} .brand .rose::after{width:20px; height:3px;}
.brand b{font-family:var(--serif); font-size:20px; font-weight:700; letter-spacing:.01em;}
.search{flex:1 1 280px; position:relative;}
.search input{width:100%; height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--line); background:var(--s1);}
.nav{display:flex; gap:4px; flex-wrap:wrap;}
.nav a{padding:7px 11px; border-radius:16px; color:var(--paper2); font-size:14px; font-weight:600;}
.nav a[aria-current="page"]{background:var(--s3); color:var(--paper);}
main{max-width:1180px; margin:0 auto; padding:20px 18px 70px;}

/* ---------- Titoli e sezioni ---------- */
h1.pg{font-family:var(--serif); font-weight:700; font-size:clamp(26px, 4vw, 38px); line-height:1.15; margin:6px 0 6px;}
.lead{color:var(--paper2); margin:0 0 18px; max-width:70ch;}
h2.sec{font-family:var(--serif); font-weight:700; font-size:21px; margin:28px 0 10px; display:flex; align-items:baseline; gap:12px;}
h2.sec a.more{font-family:var(--ui); font-size:13px; font-weight:600; color:var(--chart); margin-left:auto;}
.crumbs{font-size:13px; color:var(--paper3); margin-bottom:4px;} .crumbs a{color:var(--chart);}
.status{padding:60px 20px; text-align:center; color:var(--paper2);} .status h1{font-family:var(--serif);}

/* ---------- Righello dei decenni (il dettaglio memorabile) ---------- */
.ruler{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0, 1fr); align-items:end; gap:6px; height:150px; padding:0 2px; border-bottom:1.5px solid var(--chart2); position:relative; margin:4px 0 32px;}
.ruler a{display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; position:relative;}
.ruler .bar{width:100%; background:linear-gradient(180deg, var(--chart), var(--chart2)); border-radius:3px 3px 0 0; min-height:3px; transition:filter .15s;}
.ruler a:hover .bar, .ruler a:focus-visible .bar{filter:brightness(1.25);}
.ruler .yr{position:absolute; bottom:-24px; font-size:12px; color:var(--paper2); font-variant-numeric:tabular-nums;}
.ruler .yr::before{content:""; position:absolute; left:50%; top:-8px; width:1.5px; height:6px; background:var(--chart2);}
.ruler .ct{font-size:11px; color:var(--paper3); margin-bottom:3px; font-variant-numeric:tabular-nums;}
@media (max-width:640px){ .ruler{gap:3px; height:120px;} .ruler .yr{font-size:10px;} .ruler .ct{display:none;} }

/* ---------- Schede tipografiche ---------- */
.strip{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(150px, 170px); gap:12px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity;}
.tile{scroll-snap-align:start; display:flex; flex-direction:column; justify-content:space-between; aspect-ratio:2/3; padding:12px; border-radius:6px; background:var(--tilebg, var(--s2)); position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.06);}
.tile::after{content:""; position:absolute; inset:auto 0 0 0; height:45%; background:linear-gradient(180deg, transparent, rgba(0,0,0,.45)); pointer-events:none;}
.tile .tt{font-family:var(--serif); font-weight:700; font-size:17px; line-height:1.15; position:relative; z-index:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical;}
.tile .ty{font-size:12.5px; color:rgba(236,231,220,.8); margin-top:4px; position:relative; z-index:1;}
.tile .tb{position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-end; font-size:13px; font-weight:700;}
.tile .mp{color:var(--amber2);}
.tile:hover{border-color:var(--chart);}
.tile .tp{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;}
.tl-bg{position:absolute; inset:-14%; background:center/cover no-repeat; filter:blur(18px) brightness(.5) saturate(1.25); z-index:0;}   /* logo o schermata: intera, su sfondo sfocato di se stessa */
.tile .tl, .poster .tl{position:absolute; left:7%; top:50%; transform:translateY(-50%); width:86%; height:auto; max-height:72%; object-fit:contain; z-index:0; filter:drop-shadow(0 8px 20px rgba(0,0,0,.55));}
.tile.has-l > span:first-of-type{visibility:hidden;} .tile.has-l::after{height:30%; background:linear-gradient(180deg, transparent, rgba(0,0,0,.75));}
.poster.has-l .tt{display:none;} .fr .th.thl{object-fit:contain; background:#000;}
.nv{color:var(--amber2); font-weight:650;}
.trx .plot, #plotTxt .plot{white-space:pre-line;} #plotDet summary::-webkit-details-marker{display:none;}
.seasons{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin-bottom:6px;}
.season{position:relative; display:flex; flex-direction:column; justify-content:flex-end; aspect-ratio:2/3; padding:10px; border-radius:10px; overflow:hidden; background:var(--s2); border:1px solid rgba(255,255,255,.06);}
.season img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;} .season::after{content:""; position:absolute; inset:45% 0 0 0; background:linear-gradient(180deg, transparent, rgba(0,0,0,.8));}
.season b, .season span{position:relative; z-index:1;} .season b{font-weight:750; font-size:16px; letter-spacing:-0.015em;} .season span{font-size:12.5px; color:rgba(236,231,220,.85);}
.season:hover{border-color:var(--chart);}
.fr.ep{grid-template-columns:40px 96px minmax(0, 1fr) auto;} .fr .th.epi{width:96px; height:54px; border-radius:5px;}
.still{border-radius:12px; overflow:hidden; aspect-ratio:16/9; max-width:820px; background:var(--s2); margin-bottom:18px;} .still img{width:100%; height:100%; object-fit:cover; display:block;}
html.tv .seasons{grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));} html.tv .fr.ep{grid-template-columns:50px 140px minmax(0, 1fr) auto;} html.tv .fr .th.epi{width:140px; height:79px;}
html.tv .season:focus{transform:scale(1.06); box-shadow:0 10px 30px rgba(0,0,0,.6); z-index:2;}
html.tv .tl-bg{filter:brightness(.42); inset:0;}
.tile.has-p > span:first-of-type{visibility:hidden;}   /* la locandina ha già il titolo */
.tile.has-p::after{height:30%; background:linear-gradient(180deg, transparent, rgba(0,0,0,.75));}
.tiles{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px;}

/* ---------- Righe di elenco ---------- */
.rows{display:flex; flex-direction:column; border-top:1px solid var(--line);}
.fr{display:grid; grid-template-columns:52px 34px minmax(0, 1fr) auto; gap:12px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line);}
.fr:hover{background:var(--s1);}
.fr .th{width:34px; height:51px; object-fit:cover; border-radius:3px; background:var(--s2); display:block;}
@media (max-width:640px){   /* telefono: locandina più grande, titolo largo, distintivi sotto il titolo */
  .fr:not(.ep){grid-template-columns:58px minmax(0, 1fr) auto; grid-template-areas:"th main sc" "th badges badges"; column-gap:12px; row-gap:6px; align-items:start; padding:12px 2px;}
  .fr:not(.ep) .th{grid-area:th; width:58px; height:87px; border-radius:5px;}
  .fr:not(.ep) .fr-main{grid-area:main;} .fr:not(.ep) .sc{grid-area:sc; font-size:18px; text-align:right;} .fr:not(.ep) .sc small{font-size:10px;}
  .fr:not(.ep) .badges{grid-area:badges; justify-content:flex-start;}
  .fr b{font-size:16px; line-height:1.25;} .fr .sub{font-size:12.5px; margin-top:2px;}
  .fr.ep{grid-template-columns:30px 88px minmax(0, 1fr); column-gap:10px;} .fr.ep .badges{display:none;} .fr .th.epi{width:88px; height:50px;}
}
.fr .sc{font-family:var(--serif); font-weight:700; font-size:20px; text-align:center; font-variant-numeric:tabular-nums;}
.fr .sc small{display:block; font-family:var(--ui); font-size:10.5px; font-weight:600; color:var(--paper3);}
.fr .sc.mp{color:var(--amber2);}
.fr b{font-family:var(--serif); font-size:16.5px; font-weight:700;}
.fr em{font-style:italic; color:var(--paper2); font-size:14px;}
.fr .sub{display:block; color:var(--paper2); font-size:13px;}
.badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
.bd{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:10px; font-size:11.5px; font-weight:700; background:var(--s3); color:var(--paper2); white-space:nowrap;}
.bd.mp{background:rgba(233,162,59,.18); color:var(--amber2);} .bd.own{background:rgba(143,184,201,.16); color:var(--chart);}
.bd.pos{background:rgba(108,196,143,.16); color:var(--pos);} .bd.neg{background:rgba(240,122,110,.16); color:var(--neg);} .bd.mix{background:rgba(226,192,74,.16); color:var(--mix);}
.ctrl{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin:6px 0 14px;}
.ctrl label{display:flex; flex-direction:column; gap:3px; font-size:12px; font-weight:600; color:var(--paper2);}
.ctrl select{height:36px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--s1); min-width:150px;}
.btn{height:38px; padding:0 15px; border-radius:19px; border:1px solid var(--line); background:var(--s2); cursor:pointer; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.btn:hover{border-color:var(--chart);}
.btn.amber{background:var(--amber); border-color:var(--amber); color:#1d1406;}
.btn[aria-pressed="true"]{background:var(--chart); border-color:var(--chart); color:#0d1a20;}
.more-wrap{text-align:center; margin:16px 0;}
.genres{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px;}
.genre{padding:14px; border-radius:8px; background:var(--tilebg, var(--s2)); display:flex; justify-content:space-between; align-items:baseline; font-family:var(--serif); font-weight:700; font-size:16px;}
.genre span{font-family:var(--ui); font-size:12px; color:rgba(236,231,220,.75); font-weight:600;}
.people{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px;}
.person{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:8px; background:var(--s1); border:1px solid var(--line);}
.person b{font-family:var(--serif);} .person span{color:var(--paper3); font-size:12.5px; white-space:nowrap;}

/* ---------- Scheda del film ---------- */
.film-head{display:grid; grid-template-columns:220px minmax(0, 1fr); gap:24px; align-items:start;}
@media (max-width:700px){ .film-head{grid-template-columns:minmax(0, 1fr);} .poster{max-width:240px;} }
.poster{aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:var(--tilebg, var(--s2)); position:relative; display:flex; align-items:flex-end; padding:14px;}
.poster img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.poster img ~ .tt{display:none;}   /* con la foto o la locandina, niente titolo né iniziali sopra */
.poster .tt{font-family:var(--serif); font-weight:700; font-size:22px; line-height:1.15; position:relative;}
.orig{font-family:var(--serif); font-style:italic; color:var(--paper2); font-size:17px; margin:-2px 0 8px;}
.facts{display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--paper2); font-size:14px; margin-bottom:12px;} .facts a{color:var(--chart);}
.scores{display:flex; flex-wrap:wrap; gap:10px; margin:12px 0;}
.score{padding:10px 14px; border-radius:8px; background:var(--s1); border:1px solid var(--line); min-width:96px;}
.score b{display:block; font-family:var(--serif); font-size:24px; line-height:1.1;} .score span{font-size:12px; color:var(--paper3);}
.score.mp{border-color:var(--amber); background:rgba(233,162,59,.08);} .score.mp b{color:var(--amber2);}
.why{font-size:13px; color:var(--paper2); margin:4px 0 0;}
.marks{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.box{border:1px solid var(--line); border-radius:10px; background:var(--s1); margin:18px 0; overflow:hidden;}
.box h3{margin:0; padding:11px 14px; font-family:var(--serif); font-size:16.5px; border-bottom:1px solid var(--line);}
.box .in{padding:12px 14px;}
.kv{display:grid; grid-template-columns:150px minmax(0, 1fr); gap:6px 14px; font-size:14px;} .kv dt{color:var(--paper3);} .kv dd{margin:0;} .kv a{color:var(--chart);}
@media (max-width:560px){ .kv{grid-template-columns:minmax(0, 1fr); gap:2px;} .kv dd{margin-bottom:6px;} }
.crit-row{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:10px 14px; border-top:1px solid var(--line);} .crit-row:first-of-type{border-top:0;}
.crit-row b{min-width:150px;} .crit-row a{color:var(--chart); font-weight:600; margin-left:auto;}
.plot{font-family:var(--serif); font-size:16px; line-height:1.65; max-width:72ch;}
.note{font-size:12.5px; color:var(--paper3);}
.cast{display:flex; flex-wrap:wrap; gap:6px;} .cast a{padding:4px 10px; border-radius:14px; background:var(--s2); font-size:13.5px;}
.castgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px;}
.cm{display:flex; align-items:center; gap:11px; padding:8px 10px 8px 8px; border-radius:14px; background:var(--s2); min-width:0; border:1px solid transparent;}
.cm:hover{border-color:var(--line);}
.cm-ph{position:relative; width:46px; height:46px; border-radius:50%; overflow:hidden; background:var(--s3); flex:none; display:flex; align-items:center; justify-content:center;}
.cm-ph i{font-style:normal; font-weight:700; font-size:15px; color:var(--paper3); letter-spacing:-0.02em;}
.cm-ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.cm-ph img ~ i{display:none;}
.cm-t{min-width:0;} .cm-t b{display:block; font-weight:650; font-size:14.5px; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cm-t small{display:block; color:var(--paper3); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
html.tv .castgrid{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));} html.tv .cm-ph{width:60px; height:60px;} html.tv .cm-t b{font-size:19px;} html.tv .cm-t small{font-size:16px;}

<script>
'use strict';
/* =====================================================================
   Atlante del Cinema — enciclopedia personale dei film.
   Legge gli indici della Videoteca (stesso sito, cartella superiore):
   IMDb, cast, Frusciante e Criticoni; e l'indice della critica.
   ===================================================================== */
const APP_VERSION = '1.0';
/* Copiate dalla Videoteca da build.py: leggono gli indici esattamente come lei. */
let IMDB_INDEX = null, IMDB_INDEX_STATE = 'idle', IMDB_BY_ID = null;
let CAST_INDEX = null, CAST_STATE = 'idle', _castPromise = null;
let CRIT = null, CRIT_STATE = 'idle', _critPromise = null;
let _critFileBuilt = '', _critFileTried = false;
function normKey(t){
  let s = (t||'').toLowerCase();
  try{ s = s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){}
  s = s.replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  return s;
}
async function gunzipBase64(b64){
  const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(bin);
  writer.close();
  const buf = await new Response(ds.readable).arrayBuffer();
  return new TextDecoder('utf-8').decode(buf);
}
async function ensureImdbIndex(){
  if(IMDB_INDEX) return IMDB_INDEX;
  if(IMDB_INDEX_STATE === 'failed') return null;
  const el = document.getElementById('imdbIndexData');
  if(!el || typeof DecompressionStream === 'undefined'){ IMDB_INDEX_STATE = 'failed'; return null; }
  try{
    IMDB_INDEX_STATE = 'loading';
    const txt = await gunzipBase64(el.textContent.trim());
    const arr = [];
    for(const line of txt.split('\n')){
      if(!line) continue;
      const p = line.split('|');
      const it = p[1]||'', en = p[2]||'';
      const aliases = (p[8]||'').split('~').filter(Boolean);
      const director = p[9]||'';
      // Alias e regista entrano nella stringa di ricerca (ma non nel titolo
      // mostrato): così trovi il film con un titolo alternativo, e puoi
      // cercare offline anche per nome del regista (es. "nolan").
      const searchStr = normKey(it + ' ' + en + (aliases.length ? ' ' + aliases.join(' ') : '') + (director ? ' ' + director : ''));
      arr.push({ id:'tt'+p[0], it, en, y:p[3]||'', r:p[4]||'', g:p[5]||'', v:parseInt(p[6])||0, rt:p[7]||'', dir:director, _n: searchStr });
    }
    IMDB_INDEX = arr;
    IMDB_INDEX_STATE = 'ready';
    console.info('Indice IMDb offline pronto:', arr.length, 'film');
  }catch(e){ console.error('indice offline non caricato:', e); IMDB_INDEX_STATE = 'failed'; IMDB_INDEX = null; }
  return IMDB_INDEX;
}
function imdbEntry(id){
  if(!IMDB_INDEX || !id) return null;
  if(!IMDB_BY_ID){ IMDB_BY_ID = new Map(); IMDB_INDEX.forEach(x=>IMDB_BY_ID.set(x.id, x)); }
  return IMDB_BY_ID.get(id) || null;
}
function ensureCastIndex(){
  if(CAST_STATE === 'ready' || CAST_STATE === 'none') return Promise.resolve(CAST_INDEX);
  if(_castPromise) return _castPromise;
  const el = document.getElementById('imdbCastData');
  if(!el || !el.textContent.trim()){ CAST_STATE = 'none'; return Promise.resolve(null); }
  _castPromise = (async ()=>{
    try{
      const txt = await gunzipBase64(el.textContent.trim());
      const sep = txt.indexOf('\n#\n');
      const names = txt.slice(0, sep).split('\n');
      const keys = names.map(normKey);   // una normalizzazione per attore, non per ogni comparsa
      const byFilm = new Map(), byActor = new Map();
      const lines = txt.slice(sep + 3).split('\n');
      for(const l of lines){
        if(!l) continue;
        const i = l.indexOf('|'), id = 'tt' + l.slice(0, i), parts = l.slice(i + 1).split(','), refs = [];
        for(const x of parts){
          const r = parseInt(x, 36); if(!(r >= 0 && r < names.length)) continue;
          refs.push(r);
          const k = keys[r]; if(!k) continue;
          const a = byActor.get(k); if(a) a.push(id); else byActor.set(k, [id]);
        }
        byFilm.set(id, refs);
      }
      CAST_INDEX = { names, byFilm, byActor }; CAST_STATE = 'ready';
    }catch(e){ console.error('cast offline non caricato:', e); CAST_INDEX = null; CAST_STATE = 'none'; }
    return CAST_INDEX;
  })();
  return _castPromise;
}
function castOfFilm(imdbId){ const r = CAST_INDEX && CAST_INDEX.byFilm.get(imdbId); return r ? r.map(i=>CAST_INDEX.names[i]).filter(Boolean) : []; }
function actorFilmography(name){
  if(!CAST_INDEX || !IMDB_INDEX) return [];
  return (CAST_INDEX.byActor.get(normKey(name)) || []).map(id=>imdbEntry(id)).filter(Boolean);
}
function offlineCoStars(name, limit){
  const me = normKey(name), cnt = new Map(), disp = new Map();
  (CAST_INDEX && CAST_INDEX.byActor.get(me) || []).forEach(id=>castOfFilm(id).forEach(n=>{ const k = normKey(n); if(!k || k === me) return; cnt.set(k, (cnt.get(k) || 0) + 1); if(!disp.has(k)) disp.set(k, n); }));
  return [...cnt.entries()].filter(([, n])=>n >= 2).sort((a, b)=>b[1] - a[1]).slice(0, limit || 8).map(([k, n])=>({ name: disp.get(k), n }));
}
function castBuilt(){ const el = document.getElementById('imdbCastData'); return el && el.textContent.trim() ? ((el.dataset && el.dataset.built) || '') : ''; }
async function critFromFile(){   // copia di sicurezza nel repository (data/criticoni.json.gz), se l'indice interno è vuoto
  if(_critFileTried || !/^https?:$/.test(location.protocol) || typeof DecompressionStream === 'undefined') return null;
  _critFileTried = true;
  for(const u of ['../data/criticoni.json.gz?d=' + new Date().toISOString().slice(0, 10), '../data/criticoni.json.gz']){
    try{ const r = await fetch(u); if(!r || !r.ok) continue;
      const txt = await new Response(new Response(await r.arrayBuffer()).body.pipeThrough(new DecompressionStream('gzip'))).text();
      const d = JSON.parse(txt); if(d && (d.c || d.f)){ _critFileBuilt = d.built || ''; return txt; } }catch(e){}
  }
  return null;
}
function critBuilt(){ const el = document.getElementById('criticoniData'); return el && el.textContent.trim() ? ((el.dataset && el.dataset.built) || '') : _critFileBuilt; }
function ensureCritIndex(){
  if(CRIT_STATE === 'ready' || CRIT_STATE === 'none') return Promise.resolve(CRIT);
  if(_critPromise) return _critPromise;
  const el = document.getElementById('criticoniData');
  if(typeof DecompressionStream === 'undefined'){ CRIT_STATE = 'none'; return Promise.resolve(null); }
  const inner = el && el.textContent.trim();
  _critPromise = (inner ? gunzipBase64(inner) : critFromFile()).then(txt=>{
    if(!txt) throw new Error('nessun indice');
    const d = JSON.parse(txt), idx = { built: d.built || critBuilt(), site: d.site || 'https://filmcriticoni.it', c: new Map(), f: new Map(), n: { c: (d.c || []).length, f: (d.f || []).length } };
    ['c', 'f'].forEach(src=>(d[src] || []).forEach(r=>{
      const e = { slug: r[0], t: r[1], y: String(r[2] || ''), dir: r[3] || '', s: r[4], v: r[5] || 0, mn: r[6] || 0, p: (r[7] && r[7][0] === '/') ? r[7] : '' }, k = normKey(e.t);
      if(!k || !/^[a-z0-9-]+$/.test(e.slug)) return;
      const arr = idx[src].get(k); if(arr) arr.push(e); else idx[src].set(k, [e]);
    }));
    CRIT = idx; CRIT_STATE = 'ready'; return CRIT;
  }).catch(()=>{ CRIT_STATE = 'none'; return null; });
  return _critPromise;
}
function critMatch(src, m){
  if(!CRIT || !m || m.tipo === 'serie') return null;
  const y = parseInt(m.anno, 10), surname = normKey(String(m.regista || '').split(',')[0]).split(' ').pop();
  for(const ti of [m.titolo, m.titoloOriginale, m.originalTitle].filter(Boolean)){
    let c = CRIT[src].get(normKey(ti)); if(!c) continue;
    if(y) c = c.filter(e=>!e.y || Math.abs(parseInt(e.y, 10) - y) <= 1);   // uscita al festival e in sala possono differire di un anno
    if(!c.length) continue;
    if(c.length > 1 && surname){ const d = c.filter(e=>normKey(e.dir).split(' ').includes(surname)); if(d.length) c = d; }
    if(c.length > 1 && y){ const ex = c.filter(e=>parseInt(e.y, 10) === y); if(ex.length) c = ex; }
    if(c.length > 1 && !y) continue;                                       // senza anno, solo se l'abbinamento è unico
    return c[0];
  }
  return null;
}
</script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
/* ---------- 📺 Modalità TV: telecomando, testi grandi, margini di sicurezza ----------
   Si attiva da sola sui televisori, con ?tv=1 nell'indirizzo, o dagli Strumenti. ?tv=0 la spegne. */
const TV = (()=>{
  try{ const q = new URLSearchParams(location.search).get('tv'); if(q === '1' || q === '0') localStorage.setItem('atlante-tv', q);
    const s = localStorage.getItem('atlante-tv'); if(s === '1') return true; if(s === '0') return false; }catch(e){}
  return /Android ?TV|BRAVIA|AFT[A-Z]|SmartTV|SMART-TV|GoogleTV|Large Screen|CrKey|Tizen|WebOS|TV Bro/i.test(navigator.userAgent || '');
})();
if(TV) document.documentElement.classList.add('tv');
function tvFocusables(){
  return [...document.querySelectorAll('a[href], button:not([disabled]), input, select, textarea')].filter(el=>{
    if(el.closest('.hidden') || el.closest('[aria-hidden="true"]')) return false;
    const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
}
function tvMove(dir){   // la selezione va all'elemento più vicino nella direzione della freccia
  const list = tvFocusables(), cur = list.includes(document.activeElement) ? document.activeElement : null;
  if(!cur){ const f = list.find(el=>el.closest('#view')) || list[0]; if(f){ f.focus({ preventScroll: true }); f.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } return f || null; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for(const el of list){
    if(el === cur || el.contains(cur) || cur.contains(el)) continue;
    const b = el.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let main, side;
    if(dir === 'right'){ if(b.left < a.right - 4 && bx <= ax + 4) continue; main = Math.max(0, b.left - a.right) + 1; side = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom)) ; }
    else if(dir === 'left'){ if(b.right > a.left + 4 && bx >= ax - 4) continue; main = Math.max(0, a.left - b.right) + 1; side = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom)); }
    else if(dir === 'down'){ if(b.top < a.bottom - 4 && by <= ay + 4) continue; main = Math.max(0, b.top - a.bottom) + 1; side = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right)); }
    else { if(b.bottom > a.top + 4 && by >= ay - 4) continue; main = Math.max(0, a.top - b.bottom) + 1; side = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right)); }
    const score = main + side * 3 + (dir === 'left' || dir === 'right' ? Math.abs(by - ay) : Math.abs(bx - ax)) * 0.05;   // allineati prima, poi i più vicini
    if(score < bs){ bs = score; best = el; }
  }
  if(best){ best.focus({ preventScroll: true }); best.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
  return best;
}
document.addEventListener('keydown', ev=>{
  if(!TV) return;
  const t = ev.target, typing = t && (t.tagName === 'INPUT' && !/^(checkbox|radio|button)$/.test(t.type) || t.tagName === 'TEXTAREA');
  const dir = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up' }[ev.key];
  if(dir){ if(typing && (dir === 'left' || dir === 'right')) return; ev.preventDefault(); tvMove(dir); return; }
  if((ev.key === 'Escape' || ev.key === 'GoBack' || ev.key === 'BrowserBack' || (ev.key === 'Backspace' && !typing)) && location.hash){ ev.preventDefault(); history.back(); }
});
function tvLanding(){   // ogni pagina nuova parte con la selezione sul primo contenuto: si aspetta che i film siano disegnati
  if(!TV) return;
  let tries = 0;
  const go = () => { const v = document.getElementById('view'); if(!v) return;
    const main = ['.tile', '.fr', '.rk a', '.genre, .person'].map(q=>v.querySelector(q)).find(Boolean);
    if(!main && ++tries < 16){ setTimeout(go, 60); return; }   // l'elenco non è ancora pronto: si riprova (fino a circa un secondo)
    const f = main || ['.btn, .marks a', 'select, input', 'a[href]'].map(q=>v.querySelector(q)).find(Boolean);
    if(f) f.focus({ preventScroll: true }); window.scrollTo && window.scrollTo(0, 0); };
  setTimeout(go, 60);
}

let _tT; function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(_tT); _tT = setTimeout(()=>el.classList.remove('show'), 3200); }
const fmtR = x => x ? Number(x).toFixed(1).replace('.', ',') : '—';
const fmtV = v => v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') + ' mln' : v >= 1e3 ? Math.round(v / 1e3) + ' mila' : String(v || 0);
const GCOL = { 'Drammatico': 215, 'Commedia': 45, 'Romantico': 340, 'Crime': 0, 'Documentario': 160, 'Azione': 18, 'Thriller': 265, 'Avventura': 120, 'Horror': 350, 'Giallo': 52, 'Biografico': 30,
  'Famiglia': 95, 'Fantasy': 285, 'Storico': 35, 'Fantascienza': 190, 'Animazione': 140, 'Musica': 310, 'Guerra': 75, 'Western': 25, 'Musical': 320, 'Sport': 105, 'Noir': 230 };
const genres = e => String(e.g || '').split(/\s*,\s*/).filter(Boolean);
const tileBg = e => { const h = GCOL[genres(e)[0]] != null ? GCOL[genres(e)[0]] : 200; return `hsl(${h} 28% 24%)`; };
const decade = e => { const y = parseInt(e.y, 10); return y ? Math.floor(y / 10) * 10 : 0; };
const title = e => e.it || e.en || e.id;
const dirs = e => String(e.dir || '').split(/\s*,\s*/).filter(Boolean);
const goDir = (n, cls) => `<span class="lnk${cls ? ' ' + cls : ''}" data-go="#regista/${encodeURIComponent(n)}">${esc(n)}</span>`;
const goGen = g => `<span class="lnk" data-go="#genere/${encodeURIComponent(g)}">${esc(g)}</span>`;
const castKey = n => normKey(n).split(' ').filter(w=>w.length > 1).join(' ');   // "Tom S. Holland" = "Tom Holland"
const uniqNames = l => { const seen = new Set(); return l.filter(n=>{ const k = castKey(n); if(!k || seen.has(k)) return false; seen.add(k); return true; }); };
const _castOfFilm = castOfFilm; castOfFilm = id => uniqNames(_castOfFilm(id) || []);   // alla fonte: ogni interprete una volta sola, anche nei conteggi delle persone
const castCard = (n, kind, role, ph) => `<a class="cm" data-name="${esc(n)}" href="#${kind || 'persona'}/${encodeURIComponent(n)}"><span class="cm-ph">${ph ? `<img src="${esc(ph)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}<i>${esc(n.split(/\s+/).map(x=>x[0]).join('').slice(0, 2).toUpperCase())}</i></span><span class="cm-t"><b>${esc(n)}</b>${role ? `<small>${esc(role)}</small>` : ''}</span></a>`;
const goPerson = (n, kind) => `<a class="lnk" href="#${kind || 'persona'}/${encodeURIComponent(n)}">${esc(n)}</a>`;
document.addEventListener('click', ev=>{ const g = ev.target.closest('[data-go]'); if(!g) return; ev.preventDefault(); ev.stopPropagation(); location.hash = g.dataset.go; }, true);

/* ---------- Dati: indici della Videoteca, collezione, critica ---------- */
let CRITICA = null, OWN = new Set(), BOOT_ERR = '';
const BADP = new Set((()=>{ try{ return JSON.parse(localStorage.getItem('atlante-badp') || '[]'); }catch(e){ return []; } })());   // film con uno sfondo al posto della locandina
function posterCheck(img, id){   // l'immagine del sito si usa solo se verticale: se è orizzontale è uno sfondo, e si cerca su Wikipedia
  if(!img || !(img.naturalWidth > img.naturalHeight)) return;
  BADP.add(id); try{ localStorage.setItem('atlante-badp', JSON.stringify([...BADP])); }catch(e){}
  const host = img.closest('.tile, .fr, .poster, .rk'); if(!host) return;
  if(img.classList.contains('th')) img.outerHTML = '<span class="th"></span>'; else img.remove();
  host.classList.remove('has-p'); host.removeAttribute('data-pw'); host.setAttribute('data-pid', id); wantPoster(id);
}
const chk = (p, id) => /image\.tmdb\.org/.test(p) ? ` onload="posterCheck(this, '${id}')"` : '';
const posterUrl = (e, size) => { enrich(e); if(BADP.has(e.id)) return ''; const p = (e._f && e._f.p) || (e._c && e._c.p) || ''; return p ? 'https://image.tmdb.org/t/p/' + (size || 'w342') + p : ''; };   // dall'indice di filmcriticoni.it
async function importVideoteca(){   // la pagina della Videoteca contiene gli indici: si copiano qui, così le sue funzioni li leggono uguali
  const r = await fetch('../index.html', { cache: 'no-cache' }); if(!r.ok) throw new Error('http' + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
  let n = 0;
  ['imdbIndexData', 'imdbCastData', 'criticoniData'].forEach(id=>{ const el = doc.getElementById(id); if(!el) return; const c = document.createElement('script');
    c.type = 'text/plain'; c.id = id; c.dataset.built = el.dataset.built || el.getAttribute('data-built') || ''; c.textContent = el.textContent; document.body.appendChild(c); n++; });
  if(!doc.getElementById('imdbIndexData')) throw new Error('noindex');
  return n;
}
function readOwn(){   // i film della tua Videoteca (stesso sito): solo lettura
  try{ const j = JSON.parse(localStorage.getItem('app-data') || 'null'); const list = Array.isArray(j) ? j : (j && (j.movies || (j.state && j.state.movies))) || [];
    list.forEach(m=>{ if(m && m.imdbId && m.lista !== 'wishlist') OWN.add(m.imdbId); }); }catch(e){}
}
async function loadCritica(){
  if(typeof DecompressionStream === 'undefined') return;
  try{ const r = await fetch('../data/critica.json.gz?d=' + new Date().toISOString().slice(0, 10)); if(!r.ok) return;
    const txt = await new Response(new Response(await r.arrayBuffer()).body.pipeThrough(new DecompressionStream('gzip'))).text();
    const d = JSON.parse(txt); if(d && d.rt) CRITICA = d; }catch(e){}
}

/* ---------- Punteggio e capolavori: pubblico, critica, Frusciante e Criticoni ---------- */
const M_PRIOR = 25000, C_PRIOR = 6.8;
function enrich(e){
  if(e._s !== undefined) return e;
  const R = parseFloat(e.rt) || 0, v = e.v || 0;
  e._R = R; e._br = v ? (v / (v + M_PRIOR)) * R + (M_PRIOR / (v + M_PRIOR)) * C_PRIOR : 0;   // voto pesato: con pochi voti conta poco
  e._rt = CRITICA && CRITICA.rt[e.id] != null ? CRITICA.rt[e.id] : null; e._mc = CRITICA && CRITICA.mc[e.id] != null ? CRITICA.mc[e.id] : null;
  const q = { titolo: e.it || e.en, titoloOriginale: e.en, anno: e.y, regista: e.dir };
  e._f = CRIT ? critMatch('f', q) : null; e._c = CRIT ? critMatch('c', q) : null;
  const imdbN = clamp((e._br - 6.0) / 3.3), cr = [e._rt, e._mc].filter(x=>x != null), critN = cr.length ? cr.reduce((a, b)=>a + b, 0) / cr.length / 100 : null;
  const fs = e._f && e._f.s != null ? e._f.s : null, cs = e._c && e._c.s != null ? e._c.s : null;
  const ccN = fs == null && cs == null ? null : clamp(0.5 + (fs || 0) * 0.3 + (cs || 0) * 0.2);
  let w = 0.5, sum = 0.5 * imdbN; if(critN != null){ sum += 0.35 * critN; w += 0.35; } if(ccN != null){ sum += 0.15 * ccN; w += 0.15; }

/* ---------- Locandine per i film che il sito non ha: Wikidata → Wikipedia ----------
   Solo per le schede che stai guardando, a gruppi di 40: una richiesta a Wikidata per le voci di Wikipedia,
   una a Wikipedia per le immagini. Salvate sul dispositivo: trovate per 60 giorni, assenti per 14. */
const WPOST = new Map();

async function flushPosters(){

  _pBusy = true;
  try{
    const ids = [..._pq].slice(0, 40); ids.forEach(i=>_pq.delete(i));
    const todo = [];
    for(const id of ids){ const c = await dget('p3:' + id); if(c && Date.now() - c.at < (c.img ? 60 : 14) * 864e5){ WPOST.set(id, c.img); paintPoster(id); } else todo.push(id); }

const SEASON_POSTERS = false;   // nell'Atlante Serie TV: se la voce ha un logo, si cerca la locandina della stagione

const portrait = t => t && t.source && t.width && t.height && t.height >= t.width * 1.2;   // le locandine sono verticali; loghi e schermate no
async function pageImages(lang, titles){   // titolo → immagine verticale della voce di Wikipedia
  const out = {}; if(!titles.length) return out;
  const w = await jget(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=500&pilicense=any&redirects=1&format=json&origin=*&titles=${encodeURIComponent(titles.join('|'))}`);
  const qq = w.query || {}, alias = {}; (qq.normalized || []).concat(qq.redirects || []).forEach(n=>{ alias[n.from] = n.to; });
  const img = {}, land = {}; Object.values(qq.pages || {}).forEach(pg=>{ const t = pg.thumbnail; if(!t || !t.source) return; if(portrait(t)) img[pg.title] = t.source; else land[pg.title] = t.source; });
  titles.forEach(t0=>{ let t = t0; for(let k = 0; k < 3 && alias[t]; k++) t = alias[t]; if(img[t]) out[t0] = img[t]; else if(land[t]) LAND[t0] = land[t]; });   // le orizzontali si tengono da parte

}
async function wikiPosters(ids){
  const q = `SELECT ?imdb ?en ?it WHERE { VALUES ?imdb { ${ids.map(i=>'"' + i + '"').join(' ')} } ?f wdt:P345 ?imdb . `
    + `OPTIONAL { ?en schema:about ?f ; schema:isPartOf <https://en.wikipedia.org/> } OPTIONAL { ?it schema:about ?f ; schema:isPartOf <https://it.wikipedia.org/> } }`;

    const qs = `SELECT ?imdb ?ord ?en WHERE { VALUES ?imdb { ${rest.map(i=>'"' + i + '"').join(' ')} } ?s wdt:P345 ?imdb . ?season p:P179 ?st . ?st ps:P179 ?s ; pq:P1545 ?ord . FILTER(?ord IN ("1", "2")) `
      + `?en schema:about ?season ; schema:isPartOf <https://en.wikipedia.org/> . }`;
    try{ const js = await jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(qs)), S = {};
      ((js.results && js.results.bindings) || []).sort((a, b)=>(a.ord.value > b.ord.value ? 1 : -1)).forEach(b=>{ const id = b.imdb.value; (S[id] = S[id] || []).push(tt(b.en.value)); });
      const titles = [...new Set(Object.values(S).flat())], got = await pageImages('en', titles);
      rest.forEach(id=>{ const hit = (S[id] || []).find(t=>got[t]); if(hit) out[id] = got[hit]; }); }catch(err){}
  }
  ids.forEach(id=>{ if(!out[id] && T[id]){ const l = LAND[T[id].en] || LAND[T[id].it]; if(l) out[id] = 'L:' + l; } });   // niente locandina: il logo, intero
  return out;
}

const landHTML = u => `<span class="tl-bg" style="background-image:url('${esc(unL(u))}')"></span><img class="tl" src="${esc(unL(u))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.classList.remove('has-l'); this.remove()">`;

/* ---------- 🌍 Traduzione in italiano, senza chiavi ----------
   Prima il traduttore interno di Chrome (lavora sul dispositivo), altrimenti MyMemory (gratuito, senza registrazione,
   con un limite giornaliero). Ogni traduzione si salva sul dispositivo e non si ripete. */
const hashS = t => { let h = 5381; for(let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + '-' + t.length; };

function chunks(text, max){
  const out = []; let cur = '';
  text.split(/\n+/).forEach(par=>{ par.split(/(?<=[.!?])\s+/).forEach(s=>{ if(cur && (cur + ' ' + s).length > max){ out.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s; }); if(cur){ out.push(cur + '\n'); cur = ''; } });
  return out.flatMap(c=>c.length > max ? (c.match(new RegExp('[\\s\\S]{1,' + max + '}(\\s|$)', 'g')) || [c]) : [c]);
}
const TR_PAIR = { sourceLanguage: 'en', targetLanguage: 'it' };
async function chromeTr(){   // stato del traduttore interno di Chrome: 'available', 'downloadable', 'downloading' o 'no'
  try{ if(self.Translator && Translator.availability){ const a = await Translator.availability(TR_PAIR); return a === 'unavailable' ? 'no' : a; } }catch(e){}
  return 'no';
}
function activateChrome(btn, after){   // va chiamata dentro un clic: Chrome scarica il traduttore solo su richiesta dell'utente
  let p; try{ p = Translator.create(Object.assign({ monitor(m){ m.addEventListener('downloadprogress', ev=>{ if(btn) btn.textContent = `Scarico il traduttore di Chrome… ${Math.round((ev.loaded || 0) * 100)}%`; }); } }, TR_PAIR)); }catch(e){ p = Promise.reject(e); }
  if(btn){ btn.disabled = true; btn.textContent = 'Scarico il traduttore di Chrome…'; }
  return p.then(()=>{ toast('Traduttore di Chrome attivo: traduzioni illimitate, anche offline'); if(after) after(); }).catch(()=>{ if(btn){ btn.disabled = false; btn.textContent = 'Riprova ad attivare il traduttore di Chrome'; } toast('Chrome non è riuscito a scaricare il traduttore'); });
}
const trEmail = () => { try{ return (localStorage.getItem('tr-email') || '').trim(); }catch(e){ return ''; } };
async function translateIt(text){
  text = String(text || '').trim(); if(!text) return '';
  const key = 'tr1:' + hashS(text), c = await dget(key); if(c && c.t) return c.t;
  let out = '';
  try{ if((await chromeTr()) === 'available'){ const tr = await Translator.create(TR_PAIR); out = await tr.translate(text); } }catch(e){ out = ''; }   // prima Chrome, sul dispositivo
  if(!out){
    if(navigator.onLine === false) throw new Error('offline');
    const res = [];
    for(const part of chunks(text, 450)){
      const em = trEmail(), j = await jget('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(part.trim()) + '&langpair=en|it' + (em ? '&de=' + encodeURIComponent(em) : ''));   // con l'email il limite gratuito è 10 volte più alto
      const t = j && j.responseData && j.responseData.translatedText;
      if(!t || (j.responseStatus && +j.responseStatus !== 200) || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID/i.test(t)) throw new Error('limite');
      res.push(decodeEnt(t) + (/\n$/.test(part) ? '\n\n' : ' '));
    }
    out = res.join('').trim();
  }
  await dset(key, { t: out, at: Date.now() }); return out;
}
const trBlock = (id, text) => `<div class="trx" id="${id}"><p class="plot" lang="en">${esc(text)}</p><p class="note trn">Traduco in italiano…</p></div>`;
async function fillTr(id, text){
  try{
    const t = await translateIt(text), el = $(id); if(!el) return;
    el.innerHTML = `<p class="plot" lang="it">${esc(t)}</p><p class="note">Tradotto automaticamente dall'inglese. <button type="button" class="lnk trtg" style="background:none; border:0; padding:0; font:inherit">Mostra l'originale</button></p>`;
    el.querySelector('.trtg').onclick = ev => { const p = el.querySelector('.plot'), toEn = p.lang === 'it'; p.lang = toEn ? 'en' : 'it'; p.textContent = toEn ? text : t; ev.target.textContent = toEn ? 'Mostra la traduzione' : "Mostra l'originale"; };
  }catch(e){ const n = $(id) && $(id).querySelector('.trn'); if(!n) return;
    n.textContent = e.message === 'offline' ? 'Sei offline: la traduzione arriverà con la rete. Ecco il testo originale.' : 'Il traduttore gratuito ha finito il limite di oggi: ecco il testo originale.';
    const st = await chromeTr();   // sul computer con Chrome recente: si può passare al traduttore interno, senza limiti
    if(st === 'downloadable' || st === 'downloading'){ n.insertAdjacentHTML('beforeend', ' <button type="button" class="btn" style="height:34px; margin-top:6px">⬇️ Attiva il traduttore di Chrome (gratis, senza limiti)</button>');
      const b = n.querySelector('button'); b.onclick = () => activateChrome(b, ()=>fillTr(id, text)); }
    else if(e.message !== 'offline' && !trEmail()) n.insertAdjacentHTML('beforeend', ' Puoi alzare il limite negli <a href="#strumenti" style="color:var(--chart)">Strumenti</a>.'); }

/* ---------- 📖 La trama da Wikipedia: sezione "Trama", o "Plot" inglese tradotta ---------- */
async function wikiSection(lang, page, re){
  const sj = await jget(`https://${lang}.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(page)}&prop=sections&redirects=1&format=json&origin=*`);
  const sec = ((sj.parse && sj.parse.sections) || []).find(s=>re.test(String(s.line || '').replace(/<[^>]+>/g, '').trim())); if(!sec) return '';
  const tj = await jget(`https://${lang}.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(page)}&section=${sec.index}&prop=text&redirects=1&disabletoc=1&format=json&origin=*`);
  const box = document.createElement('div'); box.innerHTML = (tj.parse && tj.parse.text && tj.parse.text['*']) || '';
  box.querySelectorAll('sup, table, style, .mw-editsection, .reference, .hatnote, figure, .thumb, .gallery').forEach(x=>x.remove());
  return [...box.querySelectorAll('p')].map(p=>p.textContent.replace(/\s+/g, ' ').trim()).filter(t=>t.length > 30).join('\n\n');
}
async function fetchPlot(id, sl){
  const key = 'plot1:' + id, c = await dget(key); if(c && Date.now() - c.at < 60 * 864e5) return c; if(navigator.onLine === false) return c;
  const out = { at: Date.now() }, link = (l, t, a) => `https://${l}.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g, '_'))}${a || ''}`;
  if(sl && sl.it){ try{ const t = await wikiSection('it', sl.it, /^trama$/i); if(t){ out.text = t; out.lang = 'it'; out.url = link('it', sl.it, '#Trama'); } }catch(e){} }
  if(!out.text && sl && sl.en){ try{ const t = await wikiSection('en', sl.en, /^(plot|plot summary|synopsis|premise)$/i); if(t){ out.text = t; out.lang = 'en'; out.url = link('en', sl.en); } }catch(e){} }
  await dset(key, out); return out;
}
function premiseFrom(text){   // l'inizio della storia: al massimo due frasi del primo paragrafo (il finale sta sempre più avanti)
  const par = String(text || '').split(/\n+/)[0].trim(); if(!par) return '';
  const sent = par.match(/[^.!?]+[.!?]+(\s|$)/g) || [par]; let out = '';
  for(const x of sent){ if(out && (out + x).length > 380) break; out += x; if(out.split(/[.!?]/).length > 2) break; }
  out = out.trim(); if(out.length > 420) out = out.slice(0, 400).replace(/\s+\S*$/, '') + '…';
  return out;
}

function addToRanking(cid, id){

/* ---------- 📋 Importa un elenco: una classifica letta altrove diventa una tua classifica ---------- */
let _titleMap = null;
function titleMap(){   // titolo normalizzato → schede, costruita una volta sola
  if(_titleMap) return _titleMap;
  _titleMap = new Map();
  const add = (t, e) => { const k = normKey(t || ''); if(!k) return; const l = _titleMap.get(k); if(l){ if(!l.includes(e)) l.push(e); } else _titleMap.set(k, [e]); };
  ALL.forEach(e=>{ add(e.it, e); add(e.en, e); String(e.al || '').split('~').forEach(a=>add(a, e)); });   // anche i titoli alternativi
  return _titleMap;
}
function matchLine(line){
  const raw = String(line || '').trim(), nm = raw.match(/^\s*(?:n\.?\s*|#)?(\d{1,3})\s*[.)\-:°º]?\s+/i), num = nm ? +nm[1] : 0;
  let t = raw.replace(/^\s*(?:n\.?\s*|#)?\d{1,3}\s*[.)\-:°º]?\s+/i, '').replace(/[“”"«»]/g, '').replace(/[‘’]/g, "'").trim();
  const ym = t.match(/\((\d{4})/), year = ym ? +ym[1] : 0;
  t = t.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, ' ').replace(/\s+[-–—]\s+\d{4}.*$/, '').replace(/\s+/g, ' ').trim();   // tutte le precisazioni tra parentesi
  if(!t || /^(i'?ve seen|i want|seen it|see it|explore the list)/i.test(t)) return null;
  const M = titleMap(), get = x => { const k = normKey(x || ''); return k ? M.get(k) : null; };
  let c = get(t) || get(t.replace(/^(the|il|lo|la|i|gli|le|l')\s*/i, '')) || get(t.replace(/\s*&\s*/g, ' and ')) || get(t.replace(/\s*&\s*/g, ' e '))   // "&" scritto per esteso
    || (t.includes(':') ? get(t.split(':')[0]) : null);                                              // "Twin Peaks: The Return" → "Twin Peaks" (poi decide l'anno)
  if(!c || !c.length){ const k = normKey(t); if(k.length >= 8){ c = []; for(const [key, l] of M){ if(key.startsWith(k + ' ')) c.push(...l); } } }   // titolo più lungo nell'indice ("… with Tim Robinson")
  if(!c || !c.length) return { title: t, e: null, num };
  if(year){ const y = c.filter(e=>Math.abs((parseInt(e.y, 10) || 0) - year) <= 1); if(y.length) c = y; }   // l'anno separa gli omonimi
  return { title: t, e: c.slice().sort((a, b)=>(b.v || 0) - (a.v || 0))[0], num };
}
function csvRows(text){   // CSV semplice: virgole o punto e virgola, virgolette per i titoli con la virgola
  const first = String(text).split(/\r?\n/)[0] || '', sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){ const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true; else if(ch === sep){ row.push(cell); cell = ''; } else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch; }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
function csvToLines(text){   // da CSV a righe "1. Titolo (anni)"; se non è un CSV, il testo resta com'è
  const t = String(text || '').replace(/^\uFEFF/, ''), first = t.split(/\r?\n/)[0] || '';
  if(!/[,;]/.test(first)) return t;
  const rows = csvRows(t); if(rows.length < 2 || rows[0].length < 2) return t;
  const h = rows[0].map(c=>normKey(c)), find = re => h.findIndex(c=>re.test(c));
  let ti = find(/^(title|titolo|serie|film|show|name|nome)/), ri = find(/^(rank|pos|posizione|numero|n|#)$/), yi = find(/^(year|years|anno|anni)/), body = rows.slice(1);
  if(ti < 0){ body = rows; if(/^\d+$/.test(rows[0][0].trim())){ ri = 0; ti = 1; yi = rows[0].length > 2 ? 2 : -1; } else { ti = 0; ri = -1; yi = rows[0].length > 1 && /\d{4}/.test(rows[0][1]) ? 1 : -1; } }
  return body.map(r=>{ const title = (r[ti] || '').trim(); if(!title) return ''; const rank = ri >= 0 ? (r[ri] || '').trim() : '', yr = yi >= 0 ? (r[yi] || '').trim() : '';
    return `${/^\d+$/.test(rank) ? rank + '. ' : ''}${title}${yr ? ' (' + yr + ')' : ''}`; }).filter(Boolean).join('\n');
}
function importList(name, text, src, pin){
  text = csvToLines(text);
  const lines = String(text || '').split(/\n+/).map(x=>x.trim()).filter(x=>x && !/^(fonte|source)\b/i.test(x));
  const items = [], miss = [], got = lines.map(matchLine).filter(Boolean);
  if(got.length && got.filter(m=>m.num).length >= got.length * 0.6) got.sort((a, b)=>(a.num || 999) - (b.num || 999));   // righe numerate (anche da due colonne): conta il numero
  got.forEach(m=>{ if(m.e){ if(!items.includes(m.e.id)) items.push(m.e.id); } else miss.push(m.title); });
  if(!items.length) return { ok: false, miss };
  const c = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: name || 'Classifica importata', size: 0, genre: '', items, src: src || '', miss, pin: pin !== false, created: Date.now(), updated: Date.now() };
  CLS.push(c); saveCls(); return { ok: true, c, miss };
}

/* ---------- 📺 Stagioni ed episodi (solo nell'Atlante Serie TV): dati da TVmaze, gratuiti e senza chiavi ----------
   Due richieste per serie: il codice IMDb porta alla serie, poi stagioni ed episodi insieme. Salvati sul dispositivo
   (7 giorni per le serie in corso, 60 per quelle concluse). Licenza dei dati: CC BY-SA, TVmaze va citato. */
const EPISODES = false;
const TVM_NOTE = '<p class="note">Dati degli episodi: <a href="https://www.tvmaze.com/" target="_blank" rel="noopener" style="color:var(--chart)">TVmaze</a> (licenza CC BY-SA); titoli originali, trame tradotte automaticamente.</p>';
const stripHTML = h => { const d = document.createElement('div'); d.innerHTML = String(h || ''); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
const sxe = (s, n) => `${s}×${String(n).padStart(2, '0')}`;
async function fetchShow(tt){
  const e = imdbEntry(tt), key = 'tvm2:' + tt, c = await dget(key), ttl = (e && !e.y2 ? 7 : 60) * 864e5;
  if(c && Date.now() - c.at < ttl) return c; if(navigator.onLine === false) return c;
  const out = { at: Date.now() };
  let sh = null; try{ sh = await jget(`https://api.tvmaze.com/lookup/shows?imdb=${tt}`); }catch(err){}
  if(!sh || !sh.id){ await dset(key, out); return out; }
  const full = await jget(`https://api.tvmaze.com/shows/${sh.id}?embed[]=seasons&embed[]=episodes`), em = full._embedded || {};
  const img = x => x && (x.original || x.medium) || '';
  out.id = sh.id; out.url = full.url || sh.url || ''; out.sum = stripHTML(full.summary);   // la premessa della serie, scritta senza anticipazioni
  out.seasons = (em.seasons || []).filter(s=>s.number > 0).map(s=>({ n: s.number, eps: s.episodeOrder || 0, prem: s.premiereDate || '', end: s.endDate || '', img: img(s.image), url: s.url || '' }));
  out.eps = (em.episodes || []).filter(x=>x.season > 0 && x.number).map(x=>({ s: x.season, n: x.number, t: x.name || '', d: x.airdate || '', rt: x.runtime || 0, r: x.rating && x.rating.average || 0, img: img(x.image), sum: stripHTML(x.summary), url: x.url || '' }));
  out.seasons.forEach(s=>{ if(!s.eps) s.eps = out.eps.filter(x=>x.s === s.n).length; });
  await dset(key, out); return out;
}
function epMeta(x){ return [x.d ? fmtD(x.d) : '', x.rt ? x.rt + ' min' : '', x.r ? '★ ' + fmtR(x.r) : ''].filter(Boolean).join(', '); }
async function loadEpisodes(tt){   // nella pagina della serie: le stagioni cliccabili
  if(!EPISODES || !$('online')) return;
  if(!$('eps')) $('online').insertAdjacentHTML('beforebegin', '<div id="eps"></div>');
  const d = await fetchShow(tt).catch(()=>null);
  if(!$('eps') || location.hash !== '#film/' + tt) return;

}

  setNav(''); s = +s; n = +n; const e = imdbEntry(tt); if(!e) return viewFilm(tt);

  if(x.sum) fillTr('epTr', x.sum);

/* ---------- Strumenti ---------- */
const CRITICA_SCRIPT_TEXT = "#!/usr/bin/env python3\n\"\"\"\nIndice della critica per l'Atlante del Cinema.\n\nUna volta al mese raccoglie da Wikidata (gratis, senza chiavi) i voti di Rotten Tomatoes (Tomatometer, in\npercentuale) e di Metacritic per i film con un codice IMDb, e li salva in data/critica.json.gz. L'Atlante li\nusa, con i voti IMDb e i giudizi di Frusciante e dei Criticoni, per i \"capolavori assoluti\".\nRaccoglie anche, per le classifiche: incassi al botteghino (in dollari), numero di premi, Oscar ed Emmy vinti.\n\nDue richieste leggere (una per Rotten Tomatoes, una per Metacritic) che partono dai voti, non da tutti i film.\nPrima su QLever (motore veloce sui dati di Wikidata), poi, se non risponde, sul servizio ufficiale di Wikidata.\n\nUso:\n  python tools/aggiorna_critica.py data/critica.json.gz\n  python tools/aggiorna_critica.py data/critica.json.gz --local CARTELLA   # risposte salvate: q-rt.json e q-mc.json\n\nSicurezza: se nessun servizio risponde, o i voti sono troppo pochi, il file del mese prima resta com'\u00e8.\n\"\"\"\nimport datetime, gzip, json, os, re, sys, time, urllib.parse, urllib.request\n\nUA = 'MyPhysicalMovieLibrary-Atlante/1.1 (indice personale aggiornato una volta al mese)'\nENDPOINTS = [('QLever', 'https://qlever.cs.uni-freiburg.de/api/wikidata'), ('Wikidata', 'https://query.wikidata.org/sparql')]\nSOURCES = {'rt': ('Rotten Tomatoes', 'Q105584'), 'mc': ('Metacritic', 'Q150248')}\nMIN_RT = 3000\nQUERY = \"\"\"PREFIX wd: <http://www.wikidata.org/entity/>\nPREFIX wdt: <http://www.wikidata.org/prop/direct/>\nPREFIX p: <http://www.wikidata.org/prop/>\nPREFIX ps: <http://www.wikidata.org/prop/statement/>\nPREFIX pq: <http://www.wikidata.org/prop/qualifier/>\nPREFIX psv: <http://www.wikidata.org/prop/statement/value/>\nPREFIX wikibase: <http://wikiba.se/ontology#>\nSELECT ?imdb ?score ?date WHERE {\n  ?st pq:P447 wd:%s .\n  ?film p:P444 ?st .\n  ?st ps:P444 ?score .\n  ?film wdt:P345 ?imdb .\n  OPTIONAL { ?st pq:P585 ?date }\n}\"\"\"\n\n\nPFX = QUERY.split('SELECT')[0]\nEXTRA = {   # classifiche: se una richiesta non riesce, le altre (e la critica) restano\n  'box': ('incassi', PFX + 'SELECT ?imdb (MAX(?amt) AS ?n) WHERE { ?film wdt:P345 ?imdb ; p:P2142 ?st . ?st psv:P2142 ?v . ?v wikibase:quantityAmount ?amt ; wikibase:quantityUnit wd:Q4917 . FILTER(STRSTARTS(?imdb, \"tt\")) } GROUP BY ?imdb'),\n  'aw': ('premi', PFX + 'SELECT ?imdb (COUNT(DISTINCT ?aw) AS ?n) WHERE { ?film wdt:P345 ?imdb ; wdt:P166 ?aw . FILTER(STRSTARTS(?imdb, \"tt\")) } GROUP BY ?imdb HAVING(COUNT(DISTINCT ?aw) >= 2)'),\n  'osc': ('Oscar', PFX + 'SELECT ?imdb (COUNT(DISTINCT ?aw) AS ?n) WHERE { ?film wdt:P345 ?imdb ; wdt:P166 ?aw . ?aw (wdt:P31|wdt:P279|wdt:P361) wd:Q19020 . FILTER(STRSTARTS(?imdb, \"tt\")) } GROUP BY ?imdb'),\n  'emmy': ('Emmy', PFX + 'SELECT ?imdb (COUNT(DISTINCT ?aw) AS ?n) WHERE { ?film wdt:P345 ?imdb ; wdt:P166 ?aw . ?aw (wdt:P31|wdt:P279|wdt:P361) wd:Q1044427 . FILTER(STRSTARTS(?imdb, \"tt\")) } GROUP BY ?imdb'),\n}\n\n\ndef ask(key, local=None):\n    if local:\n        path = os.path.join(local, f'q-{key}.json')\n        if not os.path.exists(path): raise RuntimeError('risposta di prova mancante')\n        return json.load(open(path, encoding='utf-8')), 'prova'\n    errors = []\n    for name, url in ENDPOINTS:\n        for k in range(3):\n            try:\n                q = EXTRA[key][1] if key in EXTRA else QUERY % SOURCES[key][1]\n                req = urllib.request.Request(url + '?' + urllib.parse.urlencode({'query': q}),\n                                             headers={'User-Agent': UA, 'Accept': 'application/sparql-results+json'})\n                with urllib.request.urlopen(req, timeout=180) as r:\n                    j = json.loads(r.read().decode('utf-8'))\n                if 'results' in j: return j, name\n                errors.append(f'{name}: risposta senza risultati')\n            except Exception as e:\n                errors.append(f'{name}: {e}')\n                time.sleep(5 * (k + 1))\n    raise RuntimeError(' | '.join(errors[-3:]))\n\n\ndef parse(key, binds, out, dates):\n    for b in binds:\n        imdb = b.get('imdb', {}).get('value', ''); score = b.get('score', {}).get('value', '').strip(); date = b.get('date', {}).get('value', '')\n        if not re.match(r'^tt\\d+$', imdb) or not score: continue\n        if key == 'rt':\n            m = re.match(r'^(\\d{1,3})\\s*%$', score)                     # solo il Tomatometer in percentuale, mai le medie \"7.6/10\"\n        else:\n            m = re.match(r'^(\\d{1,3})(?:\\s*/\\s*100)?$', score)\n        if not m or int(m.group(1)) > 100: continue\n        if imdb in dates and dates[imdb] > date: continue                # si tiene il valore pi\u00f9 recente\n        dates[imdb] = date; out[imdb] = int(m.group(1))\n\n\ndef main():\n    args = sys.argv[1:]\n    if not args: print(__doc__); sys.exit(2)\n    out_path = args[0]\n    local = args[args.index('--local') + 1] if '--local' in args else None\n    built = args[args.index('--date') + 1] if '--date' in args else datetime.date.today().isoformat()\n    min_rt = 1 if '--no-min' in args else MIN_RT\n    keep = 'Il file del mese prima resta com\\'\u00e8.' if os.path.exists(out_path) else ''\n    res = {'rt': {}, 'mc': {}}\n    for key in ('rt', 'mc'):\n        try:\n            j, via = ask(key, local)\n        except Exception as e:\n            print(f'ATTENZIONE: {SOURCES[key][0]}: nessun servizio ha risposto ({e}). {keep}'); sys.exit(0 if keep else 1)\n        parse(key, j.get('results', {}).get('bindings', []), res[key], {})\n        print(f'  {SOURCES[key][0]}: {len(res[key])} film (da {via})')\n    if len(res['rt']) < min_rt:\n        print(f'ATTENZIONE: solo {len(res[\"rt\"])} voti di Rotten Tomatoes (attesi almeno {min_rt}). {keep}'); sys.exit(0 if keep else 1)\n    out = {'v': 1, 'built': built, 'rt': res['rt'], 'mc': res['mc']}\n    for key, (label, _) in EXTRA.items():\n        try:\n            j, via = ask(key, local); m = {}\n            for b in j.get('results', {}).get('bindings', []):\n                imdb, n = b.get('imdb', {}).get('value', ''), b.get('n', {}).get('value', '')\n                try: v = int(float(n))\n                except ValueError: continue\n                if re.match(r'^tt\\d+$', imdb) and v > 0: m[imdb] = v\n            if key in ('osc', 'emmy') and len(m) < 30: print(f'  {label}: solo {len(m)} titoli, classifica non credibile: la salto'); continue\n            out[key] = m; print(f'  {label}: {len(m)} titoli (da {via})')\n        except Exception as e:\n            print(f'  {label}: non disponibile stanotte ({str(e)[:80]}), si riprova la prossima')\n    os.makedirs(os.path.dirname(os.path.abspath(out_path)), exist_ok=True)\n    with open(out_path, 'wb') as f:\n        f.write(gzip.compress(json.dumps(out, separators=(',', ':')).encode('utf-8'), 9))\n    print(f'Fatto: {len(res[\"rt\"])} film con Rotten Tomatoes e {len(res[\"mc\"])} con Metacritic, data {built}.')\n\n\nif __name__ == '__main__':\n    main()\n";
const CRITICA_WORKFLOW_TEXT = "# Critica dell'Atlante: si avvia a mano (Actions \u2192 Run workflow); ogni notte alle 2 ci pensa \"Aggiornamento notturno\".\n# Si pu\u00f2 anche avviare a mano: scheda \"Actions\" \u2192 \"Aggiorna la critica (Atlante)\" \u2192 \"Run workflow\".\nname: Aggiorna la critica (Atlante)\non:\n  workflow_dispatch:\npermissions:\n  contents: write\njobs:\n  aggiorna:\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: '3.12'\n      - name: Raccogli i voti della critica da Wikidata\n        run: python tools/aggiorna_critica.py data/critica.json.gz\n      - name: Pubblica se \u00e8 cambiato\n        run: |\n          git config user.name \"aggiorna-critica\"\n          git config user.email \"github-actions[bot]@users.noreply.github.com\"\n          git add -N data/critica.json.gz 2>/dev/null || true\n          if git diff --quiet -- data; then echo \"Nessuna novit\u00e0\"; exit 0; fi\n          git add data\n          git commit -m \"Indice della critica aggiornato al $(date +%Y-%m-%d)\"\n          git pull --rebase --autostash   # se intanto un'altra automazione ha salvato, si allinea prima\n          git push\n";
function repoBase(){ const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i), seg = location.pathname.split('/').filter(Boolean); return m && seg.length >= 2 ? `https://github.com/${m[1]}/${seg[0]}` : ''; }
function viewTools(){
  setNav('strumenti'); const base = repoBase(), built = id => { const el = document.getElementById(id); return el && el.dataset.built ? el.dataset.built : ''; };
  const st = (ok, txt) => `<dt>${ok ? '✅' : '⚠️'} ${txt[0]}</dt><dd>${esc(txt[1])}</dd>`;
  V().innerHTML = `<h1 class="pg">Strumenti</h1>`
    + `<div class="box"><h3>Gli indici</h3><div class="in"><dl class="kv">${st(true, ['IMDb', `${ALL.length.toLocaleString('it-IT')} film, del ${built('imdbIndexData') || 'ultimo aggiornamento della Videoteca'}`])}`
    + st(!!CAST_INDEX, ['Attori', CAST_INDEX ? `del ${built('imdbCastData') || '?'}` : 'non ancora creato: lo crea "Aggiorna indice IMDb" della Videoteca'])
    + st(!!CRIT, ['Frusciante e Criticoni', CRIT ? `del ${CRIT.built}` : 'non ancora creato: lo crea "Aggiorna Frusciante e Criticoni" della Videoteca'])
    + (()=>{ const n = CRIT ? new Set(['f', 'c'].flatMap(k=>[...CRIT[k].values()].flat().map(x=>x.p).filter(Boolean))).size : 0;
      return st(n > 0, ['Locandine', n ? `${n.toLocaleString('it-IT')} da filmcriticoni.it` : 'arrivano con l\'indice di Frusciante e Criticoni della Videoteca']); })()
    + st(true, ['Locandine degli altri film', 'da Wikipedia, cercate mentre sfogli e salvate sul dispositivo'])
    + st(!!CRITICA, ['Critica', CRITICA ? `del ${CRITICA.built}: ${Object.keys(CRITICA.rt).length.toLocaleString('it-IT')} film con Rotten Tomatoes, ${Object.keys(CRITICA.mc).length.toLocaleString('it-IT')} con Metacritic` : 'non ancora creato: segui la guida qui sotto'])
    + `</dl><p class="note">Tutti gli indici si aggiornano da soli ogni notte alle 2 (ora di Roma). <a href="../" style="color:var(--chart)">Apri la Videoteca</a>, <a href="../serie/" style="color:var(--chart)">Apri l'Atlante Serie TV</a>${CRIT ? '<br>Le locandine sono immagini di TMDB, raccolte dalle schede di filmcriticoni.it.' : ''}</p></div></div>`
    + `<div class="box"><h3>Attiva l'indice della critica (una volta sola)</h3><div class="in"><p>Serve per i capolavori con Rotten Tomatoes e Metacritic. Si aggiorna ogni notte alle 2 (ora di Roma) con l'automazione \"Aggiornamento notturno\".</p><p class="note"><b>Hai caricato il pacchetto completo?</b> Allora lo script (tools/aggiorna_critica.py) e l'automazione (.github/workflows/aggiorna-critica.yml) sono già nel repository: passa direttamente al punto 3. Se l'automazione si ferma, l'ultima riga del riepilogo dice il perché.</p>`
    + (base ? `<ol style="line-height:1.8"><li><b>Lo script:</b> <button class="btn" type="button" data-copy="s">📋 Copia lo script</button> poi <a class="btn" target="_blank" rel="noopener" href="${esc(base + '/new/main?filename=' + encodeURIComponent('tools/aggiorna_critica.py'))}">Crea il file ↗</a>, incolla e premi "Commit changes".</li>`
      + `<li><b>L'automazione:</b> <a class="btn" target="_blank" rel="noopener" href="${esc(base + '/new/main?filename=' + encodeURIComponent('.github/workflows/aggiorna-critica.yml') + '&value=' + encodeURIComponent(CRITICA_WORKFLOW_TEXT))}">Crea l'automazione ↗</a> e premi "Commit changes".</li>`
      + `<li><b>Il primo aggiornamento:</b> <a class="btn" target="_blank" rel="noopener" href="${esc(base + '/actions/workflows/aggiorna-critica.yml')}">Apri GitHub Actions ↗</a> → "Run workflow". Dopo 10-20 minuti, riapri l'Atlante.</li></ol>`
      : `<p class="note">Pubblica prima l'Atlante su GitHub Pages, nella cartella atlante del repository della Videoteca: qui compariranno i link diretti.</p><button class="btn" type="button" data-copy="s">📋 Copia lo script</button>`)
    + `<textarea class="copy hidden" id="copyArea" readonly></textarea></div></div>`
    + `<div class="box"><h3>🌍 Traduzione in italiano</h3><div class="in"><p>Trame degli episodi e testi di Wikipedia in inglese vengono tradotti in automatico, senza chiavi. Ogni testo si traduce una volta sola e poi resta salvato.</p><p id="trState" class="note">Controllo il traduttore di Chrome…</p>`
    + `<div class="ctrl"><label>La tua email per MyMemory (facoltativa)<input id="trEmail" type="email" value="${esc(trEmail())}" placeholder="nome@esempio.it" style="height:36px; border-radius:8px; border:1px solid var(--line); background:var(--ink); padding:0 10px; min-width:240px"></label><button class="btn" type="button" id="trSave">Salva</button></div>`
    + `<p class="note">MyMemory è il traduttore gratuito usato su telefono e televisore. Con un indirizzo email il suo limite passa da circa 5.000 a circa 50.000 caratteri al giorno (circa 200 trame). L'indirizzo resta su questo dispositivo e viene inviato solo a MyMemory, insieme ai testi da tradurre.</p></div></div>`
    + `<div class="box"><h3>📺 Modalità TV</h3><div class="in"><p>Testi grandi, margini di sicurezza e navigazione con le frecce del telecomando: OK apre, Indietro torna alla pagina precedente. Si attiva da sola sui televisori; per salvarla nei preferiti del browser del televisore usa l'indirizzo che finisce con <b>?tv=1</b>.</p><div class="marks"><button class="btn${TV ? ' amber' : ''}" type="button" id="tvBtn" aria-pressed="${TV}">${TV ? '📺 Modalità TV attiva: disattiva' : '📺 Attiva la modalità TV'}</button></div></div></div>`
    + `<div class="box"><h3>Le tue liste</h3><div class="in"><p>Visti, da vedere, preferiti, i tuoi voti e le classifiche restano su questo dispositivo. Fai una copia per non perderli.</p><div class="marks"><button class="btn" type="button" id="bk">💾 Scarica le liste</button><button class="btn" type="button" id="rs">📥 Ripristina le liste</button><input type="file" id="rsIn" accept=".json,application/json" class="hidden"></div></div></div>`
    + `<div class="box"><h3>Come si calcolano i capolavori</h3><div class="in"><p>Ogni film riceve un punteggio da 0 a 100: per metà dal voto IMDb (pesato sul numero di voti, così pochi voti contano poco), per il 35% dalla critica (Rotten Tomatoes e Metacritic) e per il 15% dai giudizi di Frusciante e dei Criticoni. Se una fonte manca, le altre pesano di più. Il punteggio serve a ordinare.</p><p>È un <b>capolavoro</b> un film con: almeno 50.000 voti; voto pesato da 8,0 in su, oppure da 7,8 in su se la critica supera il 90% o se Frusciante o i Criticoni lo promuovono; la critica, quando c'è, almeno all'80%; nessuna stroncatura di Frusciante, a meno che la critica non superi il 90%. I film degli ultimi 4 anni devono superare anche il banco di prova del tempo: serve la conferma della critica (almeno 85%) o di Frusciante o dei Criticoni, perché i voti dei film nuovi possono essere gonfiati da campagne organizzate. Un capolavoro diventa <b>capolavoro assoluto</b> (✦✦) quando il suo punteggio arriva a 90: succede solo se pubblico e critica sono entrambi altissimi.</p></div></div>`;
  V().querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(CRITICA_SCRIPT_TEXT); toast('📋 Script copiato: ora premi "Crea il file" e incollalo'); }catch(err){ const t = $('copyArea'); t.value = CRITICA_SCRIPT_TEXT; t.classList.remove('hidden'); t.select(); } }));
  $('trSave').onclick = () => { const v = $('trEmail').value.trim(); if(v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ toast('Controlla l\'indirizzo email'); return; } try{ localStorage.setItem('tr-email', v); }catch(e){} toast(v ? 'Salvata: limite di MyMemory 10 volte più alto' : 'Email tolta'); };
  chromeTr().then(st=>{ const el = $('trState'); if(!el) return;
    el.innerHTML = st === 'available' ? '✅ Traduttore di Chrome attivo su questo dispositivo: traduzioni illimitate, anche offline.' : (st === 'downloadable' || st === 'downloading') ? 'Su questo computer puoi attivare il traduttore di Chrome: gratis, senza limiti e anche offline. <button type="button" class="btn" id="trChrome" style="height:34px">⬇️ Attivalo</button>' : 'Il traduttore interno di Chrome non è disponibile su questo dispositivo (c\'è solo in Chrome per computer): si usa MyMemory.';
    if($('trChrome')) $('trChrome').onclick = () => activateChrome($('trChrome'), ()=>{ if($('trState')) $('trState').textContent = '✅ Traduttore di Chrome attivo su questo dispositivo: traduzioni illimitate, anche offline.'; }); });
  $('tvBtn').onclick = () => { try{ localStorage.setItem('atlante-tv', TV ? '0' : '1'); }catch(e){} location.reload(); };
  $('bk').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'Atlante del Cinema', liste: LISTE, classifiche: CLS }, null, 1)], { type: 'application/json' })); a.download = `atlante-liste-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(), 1000); toast('Liste scaricate'); };
  $('rs').onclick = () => $('rsIn').click();
  $('rsIn').onchange = ev => { const f = ev.target.files[0]; ev.target.value = ''; if(!f) return; const r = new FileReader();
    r.onload = () => { try{ const j = JSON.parse(r.result); if(!j || typeof j.liste !== 'object') throw new Error('x'); Object.entries(j.liste).forEach(([id, v])=>{ LISTE[id] = Object.assign({}, LISTE[id] || {}, v); }); localStorage.setItem(LKEY, JSON.stringify(LISTE));
      (Array.isArray(j.classifiche) ? j.classifiche : []).forEach(c=>{ if(c && c.id && Array.isArray(c.items) && !CLS.some(x=>x.id === c.id)) CLS.push(c); }); saveCls();
      toast(`Ripristinati: ${Object.keys(j.liste).length} film nelle liste, ${(j.classifiche || []).length} classifiche`); }catch(err){ toast('Questo file non è una copia delle liste dell\'Atlante'); } }; r.readAsText(f); };
}

/* ---------- Navigazione ---------- */
function route(){
  if(BOOT_ERR) return;
  const h = decodeURIComponent(location.hash.replace(/^#/, '')), [k, ...rest] = h.split('/'), arg = rest.join('/');
  ROW_EXTRA = null;
  window.scrollTo && window.scrollTo(0, 0);
  if(k === 'film') return viewFilm(arg);
  if(k === 'lista') return viewNamedList(arg);
  if(k === 'genere') return viewGenre(arg);
  if(k === 'decennio') return viewDecade(arg);
  if(k === 'registi') return viewDirectors();
  if(k === 'regista') return viewDirector(arg);
  if(k === 'attori') return viewActors();
  if(k === 'attore') return viewActor(arg);
  if(k === 'cerca') return viewSearch(arg);
  if(k === 'liste') return viewLists(arg);
  if(k === 'classifiche') return viewRankings();
  if(k === 'classifica') return viewRanking(arg);
  if(k === 'persona') return viewPersona(arg);
  if(EPISODES && k === 'stagione'){ const [tt, n] = arg.split('/'); return viewSeason(tt, n); }
  if(EPISODES && k === 'episodio'){ const [tt, sn, en] = arg.split('/'); return viewEpisode(tt, sn, en); }
  if(k === 'strumenti') return viewTools();
  viewHome();
}
window.addEventListener('hashchange', tvLanding);
let _qT = null;
$('q').addEventListener('input', ()=>{ clearTimeout(_qT); const v = $('q').value.trim(); _qT = setTimeout(()=>{ if(v.length >= 2) location.hash = '#cerca/' + encodeURIComponent(v); }, 350); });
$('searchForm').addEventListener('submit', ev=>{ ev.preventDefault(); const v = $('q').value.trim(); if(v) location.hash = '#cerca/' + encodeURIComponent(v); });
window.addEventListener('hashchange', route);
async function boot(){
  try{ await importVideoteca(); }
  catch(e){ BOOT_ERR = e.message; V().innerHTML = `<div class="status"><h1>Non trovo la Videoteca</h1><p>L'Atlante legge gli indici della Videoteca, quindi va messo nella cartella <b>atlante</b> del repository della Videoteca e aperto dal suo indirizzo GitHub Pages (per esempio tuonome.github.io/videoteca/atlante/).</p><p class="note">Dettaglio: ${esc(e.message)}${navigator.onLine === false ? ', e sei offline: la prima apertura richiede la rete' : ''}</p></div>`; return; }
  await ensureImdbIndex();
  if(!IMDB_INDEX){ BOOT_ERR = 'index'; V().innerHTML = '<div class="status"><h1>Indice non leggibile</h1><p>Il browser non riesce a leggere l\'indice: aggiorna Edge, Chrome o Safari all\'ultima versione.</p></div>'; return; }
  await Promise.all([ensureCritIndex(), loadCritica(), ensureCastIndex()]);
  if(CAST_INDEX && CAST_INDEX.byActor) CAST_INDEX.byActor.forEach((ids, k)=>CAST_INDEX.byActor.set(k, [...new Set(ids)]));   // ogni film una volta sola per attore
  readOwn(); computeAll(); route(); tvLanding();
  fetchNovita().then(()=>{ if(!location.hash || location.hash === '#') viewHome(); else if(/^#lista\/(novita|nuove)/.test(location.hash)) route(); }).catch(()=>{});
  if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.__ready = true;
}
boot();
