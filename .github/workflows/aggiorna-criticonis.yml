# Frusciante e i Criticoni: si avvia a mano (Actions → Run workflow); ogni notte alle 2 ci pensa "Aggiornamento notturno".
# Si può anche avviare a mano: scheda "Actions" → "Aggiorna Frusciante e Criticoni" → "Run workflow".
name: Aggiorna Frusciante e Criticoni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ricostruisci l'indice dagli elenchi di filmcriticoni.it
        run: python tools/aggiorna_criticoni.py index.html
      - name: Pubblica se è cambiato
        run: |
          git config user.name "aggiorna-criticoni"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then echo "Nessuna novità"; exit 0; fi
          git add index.html
          git commit -m "Indice Frusciante e Criticoni aggiornato al $(date +%Y-%m-%d)"
          git push
