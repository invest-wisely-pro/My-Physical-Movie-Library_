# Aggiornamento notturno: ogni notte dopo le 2 (ora di Roma) aggiorna, uno dopo l'altro, l'indice IMDb (film, serie,
# attori), Frusciante e i Criticoni, e la critica dell'Atlante. Salva una volta sola e, per non far crescere il
# repository, sostituisce il salvataggio della notte prima (mai i tuoi).
# GitHub a volte avvia le automazioni programmate con ore di ritardo, o le salta: per questo ci sono più turni
# in tutta la giornata; il primo che parte dopo le 2 fa l'aggiornamento, gli altri vedono che è già fatto
# e si fermano in pochi secondi.
# Si può anche avviare a mano: scheda "Actions" → "Aggiornamento notturno" → "Run workflow".
name: Aggiornamento notturno
on:
  schedule:
    - cron: '23 * * * *'   # un turno ogni ora, tutto il giorno: GitHub ne avvia pochi e in ritardo, basta che ne parta uno dopo le 2 di Roma
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aggiornamenti
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 60
      - name: Tocca a questo turno?
        id: ora
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "Avviato a mano: si aggiorna."; echo "via=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          OGGI=$(TZ=Europe/Rome date +%Y-%m-%d); ORA=$(TZ=Europe/Rome date +%-H)
          if git log -n 60 --format=%s | grep -qx "Aggiornamento notturno del $OGGI"; then
            echo "L'aggiornamento di oggi ($OGGI) è già fatto: questo turno si ferma."; echo "via=0" >> "$GITHUB_OUTPUT"
          elif [ "$ORA" -lt 2 ]; then
            echo "A Roma sono le $ORA: troppo presto, ci pensa il prossimo turno."; echo "via=0" >> "$GITHUB_OUTPUT"
          else
            echo "A Roma sono le $ORA e l'aggiornamento di oggi ($OGGI) manca: si parte."; echo "via=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.ora.outputs.via == '1'
        with:
          python-version: '3.12'
      - name: Indice IMDb (film, serie, attori)
        if: steps.ora.outputs.via == '1'
        continue-on-error: true
        run: python tools/aggiorna_indice.py index.html
      - name: Frusciante e i Criticoni
        if: steps.ora.outputs.via == '1'
        continue-on-error: true
        run: python tools/aggiorna_criticoni.py index.html
      - name: Critica (Rotten Tomatoes e Metacritic)
        if: steps.ora.outputs.via == '1'
        continue-on-error: true
        run: python tools/aggiorna_critica.py data/critica.json.gz
      - name: Pubblica, sostituendo l'aggiornamento della notte prima
        if: steps.ora.outputs.via == '1'
        run: |
          git config user.name "aggiornamento-notturno"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -N data 2>/dev/null || true
          if git diff --quiet -- index.html data; then echo "Nessuna novità"; exit 0; fi
          git add index.html data
          MSG="Aggiornamento notturno del $(TZ=Europe/Rome date +%Y-%m-%d)"
          if [ "$(git log -1 --format=%an)" = "aggiornamento-notturno" ]; then
            git commit --amend -m "$MSG"     # si sostituisce quello della notte prima: il repository non cresce
            git push --force-with-lease
          else
            git commit -m "$MSG"             # l'ultimo salvataggio è tuo: se ne aggiunge uno nuovo
            git push
          fi
