# Aggiorna ogni mese l'indice della critica dell'Atlante del Cinema (Rotten Tomatoes e Metacritic da Wikidata).
# Si può anche avviare a mano: scheda "Actions" → "Aggiorna la critical (Atlante)" → "Run workflow".
name: Aggiorna la critical (Atlante)
on:
  schedule:
    - cron: '0 6 15 * *'    # il 15 di ogni mese alle 6:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Raccogli i voti della critica da Wikidata
        run: python tools/aggiorna_critical.py data/critica.json.gz
      - name: Pubblica se è cambiato
        run: |
          git config user.name "aggiorna-critica"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -N data/critica.json.gz 2>/dev/null || true
          if git diff --quiet -- data; then echo "Nessuna novità"; exit 0; fi
          git add data
          git commit -m "Indice della critica aggiornato al $(date +%Y-%m-%d)"
          git push
