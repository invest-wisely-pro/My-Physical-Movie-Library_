# Aggiorna ogni mese l'indice IMDb offline dell'app con i dati ufficiali di IMDb.
# Si può anche avviare a mano: scheda "Actions" → "Aggiorna indice IMDb" → "Run workflow".
name: Aggiorna indice IMDb
on:
  schedule:
    - cron: '0 4 3 * *'     # il 3 di ogni mese alle 4:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ricostruisci l'indice dai dati IMDb di oggi
        run: python tools/aggiorna_indice.py index.html
      - name: Pubblica se è cambiato
        run: |
          git config user.name "aggiorna-indice"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then echo "Nessuna novità"; exit 0; fi
          git add index.html
          git commit -m "Indice IMDb aggiornato al $(date +%Y-%m-%d)"
          git push
