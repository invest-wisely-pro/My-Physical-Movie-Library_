name: Costruisci l'APK degli Atlanti
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Costruisci l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PbaseUrl="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" -Pvc=${{ github.run_number }}
      - name: Pubblica il file da scaricare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Atlante.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest Atlante.apk --title "Atlante (APK)" --notes "Costruito il $(date -u +%F). Contiene Atlante del Cinema e Atlante Serie TV."
