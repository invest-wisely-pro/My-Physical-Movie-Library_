<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1416">
<title>Atlante Serie TV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
:root{
  --ink:#0F1416; --s1:#172024; --s2:#1E2A2F; --s3:#26353B; --line:#2C3A40; --paper:#ECE7DC; --paper2:#B5B0A4; --paper3:#857F74;
  --chart:#B9A3E3; --chart2:#7E68A8; --amber:#E9A23B; --amber2:#F5C26B; --pos:#6CC48F; --neg:#F07A6E; --mix:#E2C04A;
  --serif:-apple-system, BlinkMacSystemFont, 'Inter Atlante', 'Segoe UI Variable Display', 'Segoe UI', Roboto, Arial, sans-serif;   /* titoli: San Francisco sui dispositivi Apple, altrove Inter */
  --ui:-apple-system, BlinkMacSystemFont, 'Inter Atlante', 'Segoe UI Variable Text', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
}
@font-face{font-family:'Inter Atlante'; src:url('fonts/inter-var.woff2') format('woff2-variations'), url('fonts/inter-var.woff2') format('woff2'); font-weight:100 900; font-style:normal; font-display:swap;}   /* Inter, SIL Open Font License: fonts/OFL.txt */
*,*::before,*::after{box-sizing:inherit;}
body{margin:0; background:var(--ink); color:var(--paper); font-family:var(--ui); font-size:15px; line-height:1.5;}
a{color:inherit; text-decoration:none;}
button, input, select{font:inherit; color:inherit;}
:focus-visible{outline:2px solid var(--chart); outline-offset:2px;}
.hidden{display:none !important;}
.lnk{color:var(--chart); cursor:pointer;} .lnk:hover{text-decoration:underline;} .fr .sub .lnk, .tile .ty .lnk{color:inherit; text-decoration:underline; text-decoration-color:rgba(143,184,201,.45); text-underline-offset:2px;}
.rate-wrap{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:8px 0 2px;} .rate{display:flex; gap:4px; flex-wrap:wrap;}
.rate button{width:32px; height:32px; border-radius:7px; border:1px solid var(--line); background:var(--s2); cursor:pointer; font-weight:700; font-size:13px;}
.rate button[aria-pressed="true"]{background:var(--amber); border-color:var(--amber); color:#1d1406;}
.poster.pphoto{border-radius:50%; aspect-ratio:1; width:200px; max-width:100%; align-items:center; justify-content:center; padding:0;} .poster.pphoto .tt{font-size:42px; color:var(--paper3);}   /* tondo: più specifico di .poster */
.rk-list{display:flex; flex-direction:column; border-top:1px solid var(--line); margin-bottom:16px;}
.rk{display:grid; grid-template-columns:40px 34px minmax(0, 1fr) auto; gap:12px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line);}
.rk .rk-n{font-family:var(--serif); font-weight:700; font-size:22px; text-align:center; color:var(--amber2);} .rk .th{width:34px; height:51px; object-fit:cover; border-radius:3px; background:var(--s2); display:block;}
.rk .sub{display:block; color:var(--paper2); font-size:13px;} .rk-a{display:flex; gap:6px;} .rk-a .btn{height:32px; padding:0 10px;} .rk-a .btn:disabled{opacity:.35; cursor:default;}
/* ---------- 📺 Modalità TV: da leggere dal divano, con il telecomando ---------- */
html.tv{font-size:20px;}
html.tv body{font-size:20px;}
html.tv .top{backdrop-filter:none; background:var(--ink);}
html.tv .top-in, html.tv main{max-width:none; padding-left:5vw; padding-right:5vw;}   /* margini di sicurezza ai bordi */
html.tv main{padding-top:3vh; padding-bottom:6vh;}
html.tv .nav a{font-size:19px; padding:10px 16px;}
html.tv .search input{height:52px; font-size:20px;}
html.tv h1.pg{font-size:46px;} html.tv h2.sec{font-size:28px; margin-top:34px;}
html.tv .strip{grid-auto-columns:minmax(200px, 220px); gap:18px; padding:10px 8px 14px; scroll-snap-type:none;}
html.tv .tiles{grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));}
html.tv .tile .tt{font-size:22px;} html.tv .tile .ty, html.tv .tile .tb{font-size:16px;}
html.tv .fr{grid-template-columns:70px 46px minmax(0, 1fr) auto; padding:14px 8px;} html.tv .fr .th{width:46px; height:69px;}
html.tv .fr b{font-size:22px;} html.tv .fr .sub{font-size:17px;} html.tv .fr .sc{font-size:26px;}
html.tv .btn{height:52px; padding:0 22px; font-size:19px; border-radius:26px;}
html.tv .rate button{width:46px; height:46px; font-size:18px;}
html.tv .genre{padding:20px; font-size:21px;} html.tv .person{padding:16px;}
html.tv .kv{grid-template-columns:220px minmax(0, 1fr); font-size:18px;} html.tv .plot{font-size:21px;}
html.tv .ruler{height:200px;} html.tv .ruler .yr{font-size:16px;}
html.tv :focus{outline:none;}
html.tv a:focus, html.tv button:focus, html.tv input:focus, html.tv select:focus{outline:5px solid var(--amber); outline-offset:4px; border-radius:8px;}
html.tv .tile:focus, html.tv .genre:focus, html.tv .person:focus{transform:scale(1.07); box-shadow:0 10px 30px rgba(0,0,0,.6); z-index:2; position:relative;}
html.tv .fr:focus, html.tv .rk a:focus{background:var(--s2);}
html.tv .tile, html.tv .genre, html.tv .person{transition:transform .12s ease-out;}
html.tv .tile .tp{will-change:auto;}
/* ---------- Tipografia in stile Apple TV: titoli grassi e compatti, numeri in colonna ---------- */
body{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; font-optical-sizing:auto; letter-spacing:-0.003em;}
.brand b{font-weight:800; letter-spacing:-0.025em;}
h1.pg{font-weight:800; letter-spacing:-0.03em; line-height:1.05;}
h2.sec{font-weight:700; letter-spacing:-0.02em; font-size:22px;}
.box h3{font-weight:700; letter-spacing:-0.012em;}
.tile .tt, .poster .tt{font-weight:750; letter-spacing:-0.018em;}
.fr b{font-weight:650; letter-spacing:-0.012em;}
.fr em{font-style:normal; color:var(--paper3); font-weight:500;}
.orig{font-style:normal; font-weight:500; letter-spacing:-0.01em;}
.fr .sc, .score b, .rk .rk-n{font-weight:750; letter-spacing:-0.025em; font-variant-numeric:tabular-nums;}
.genre{font-weight:700; letter-spacing:-0.012em;} .person b{font-weight:650; letter-spacing:-0.01em;}
.plot{font-family:var(--ui); font-size:17px; line-height:1.62;}
.nav a{letter-spacing:-0.005em;} .lead{letter-spacing:-0.006em;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ---------- Testata ---------- */
.top{position:sticky; top:0; z-index:30; background:rgba(15,20,22,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);}
.top-in{max-width:1180px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:12px 18px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; white-space:nowrap;}
.brand .rose{width:28px; height:28px; border:1.5px solid var(--chart); border-radius:50%; position:relative;}
.brand .rose::before, .brand .rose::after{content:""; position:absolute; left:50%; top:50%; background:var(--amber); transform:translate(-50%,-50%) rotate(45deg);}
.brand .rose::before{width:3px; height:20px;} .brand .rose::after{width:20px; height:3px;}
.brand b{font-family:var(--serif); font-size:20px; font-weight:700; letter-spacing:.01em;}
.search{flex:1 1 280px; position:relative;}
.search input{width:100%; height:40px; padding:0 14px; border-radius:20px; border:1px solid var(--line); background:var(--s1);}
.nav{display:flex; gap:4px; flex-wrap:wrap;}
.nav a{padding:7px 11px; border-radius:16px; color:var(--paper2); font-size:14px; font-weight:600;}
.nav a[aria-current="page"]{background:var(--s3); color:var(--paper);}
main{max-width:1180px; margin:0 auto; padding:20px 18px 70px;}

/* ---------- Titoli e sezioni ---------- */
h1.pg{font-family:var(--serif); font-weight:700; font-size:clamp(26px, 4vw, 38px); line-height:1.15; margin:6px 0 6px;}
.lead{color:var(--paper2); margin:0 0 18px; max-width:70ch;}
h2.sec{font-family:var(--serif); font-weight:700; font-size:21px; margin:28px 0 10px; display:flex; align-items:baseline; gap:12px;}
h2.sec a.more{font-family:var(--ui); font-size:13px; font-weight:600; color:var(--chart); margin-left:auto;}
.crumbs{font-size:13px; color:var(--paper3); margin-bottom:4px;} .crumbs a{color:var(--chart);}
.status{padding:60px 20px; text-align:center; color:var(--paper2);} .status h1{font-family:var(--serif);}

/* ---------- Righello dei decenni (il dettaglio memorabile) ---------- */
.ruler{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0, 1fr); align-items:end; gap:6px; height:150px; padding:0 2px; border-bottom:1.5px solid var(--chart2); position:relative; margin:4px 0 32px;}
.ruler a{display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; position:relative;}
.ruler .bar{width:100%; background:linear-gradient(180deg, var(--chart), var(--chart2)); border-radius:3px 3px 0 0; min-height:3px; transition:filter .15s;}
.ruler a:hover .bar, .ruler a:focus-visible .bar{filter:brightness(1.25);}
.ruler .yr{position:absolute; bottom:-24px; font-size:12px; color:var(--paper2); font-variant-numeric:tabular-nums;}
.ruler .yr::before{content:""; position:absolute; left:50%; top:-8px; width:1.5px; height:6px; background:var(--chart2);}
.ruler .ct{font-size:11px; color:var(--paper3); margin-bottom:3px; font-variant-numeric:tabular-nums;}
@media (max-width:640px){ .ruler{gap:3px; height:120px;} .ruler .yr{font-size:10px;} .ruler .ct{display:none;} }

/* ---------- Schede tipografiche ---------- */
.strip{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(150px, 170px); gap:12px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity;}
.tile{scroll-snap-align:start; display:flex; flex-direction:column; justify-content:space-between; aspect-ratio:2/3; padding:12px; border-radius:6px; background:var(--tilebg, var(--s2)); position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.06);}
.tile::after{content:""; position:absolute; inset:auto 0 0 0; height:45%; background:linear-gradient(180deg, transparent, rgba(0,0,0,.45)); pointer-events:none;}
.tile .tt{font-family:var(--serif); font-weight:700; font-size:17px; line-height:1.15; position:relative; z-index:1; overflow:hidden; display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical;}
.tile .ty{font-size:12.5px; color:rgba(236,231,220,.8); margin-top:4px; position:relative; z-index:1;}
.tile .tb{position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-end; font-size:13px; font-weight:700;}
.tile .mp{color:var(--amber2);}
.tile:hover{border-color:var(--chart);}
.tile .tp{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;}
.tl-bg{position:absolute; inset:-14%; background:center/cover no-repeat; filter:blur(18px) brightness(.5) saturate(1.25); z-index:0;}   /* logo o schermata: intera, su sfondo sfocato di se stessa */
.tile .tl, .poster .tl{position:absolute; left:7%; top:50%; transform:translateY(-50%); width:86%; height:auto; max-height:72%; object-fit:contain; z-index:0; filter:drop-shadow(0 8px 20px rgba(0,0,0,.55));}
.tile.has-l > span:first-of-type{visibility:hidden;} .tile.has-l::after{height:30%; background:linear-gradient(180deg, transparent, rgba(0,0,0,.75));}
.poster.has-l .tt{display:none;} .fr .th.thl{object-fit:contain; background:#000;}
.nv{color:var(--amber2); font-weight:650;}
html.tv .tl-bg{filter:brightness(.42); inset:0;}
.tile.has-p > span:first-of-type{visibility:hidden;}   /* la locandina ha già il titolo */
.tile.has-p::after{height:30%; background:linear-gradient(180deg, transparent, rgba(0,0,0,.75));}
.tiles{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px;}

/* ---------- Righe di elenco ---------- */
.rows{display:flex; flex-direction:column; border-top:1px solid var(--line);}
.fr{display:grid; grid-template-columns:52px 34px minmax(0, 1fr) auto; gap:12px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line);}
.fr:hover{background:var(--s1);}
.fr .th{width:34px; height:51px; object-fit:cover; border-radius:3px; background:var(--s2); display:block;}
.fr .sc{font-family:var(--serif); font-weight:700; font-size:20px; text-align:center; font-variant-numeric:tabular-nums;}
.fr .sc small{display:block; font-family:var(--ui); font-size:10.5px; font-weight:600; color:var(--paper3);}
.fr .sc.mp{color:var(--amber2);}
.fr b{font-family:var(--serif); font-size:16.5px; font-weight:700;}
.fr em{font-style:italic; color:var(--paper2); font-size:14px;}
.fr .sub{display:block; color:var(--paper2); font-size:13px;}
.badges{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
.bd{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:10px; font-size:11.5px; font-weight:700; background:var(--s3); color:var(--paper2); white-space:nowrap;}
.bd.mp{background:rgba(233,162,59,.18); color:var(--amber2);} .bd.own{background:rgba(143,184,201,.16); color:var(--chart);}
.bd.pos{background:rgba(108,196,143,.16); color:var(--pos);} .bd.neg{background:rgba(240,122,110,.16); color:var(--neg);} .bd.mix{background:rgba(226,192,74,.16); color:var(--mix);}
.ctrl{display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin:6px 0 14px;}
.ctrl label{display:flex; flex-direction:column; gap:3px; font-size:12px; font-weight:600; color:var(--paper2);}
.ctrl select{height:36px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--s1); min-width:150px;}
.btn{height:38px; padding:0 15px; border-radius:19px; border:1px solid var(--line); background:var(--s2); cursor:pointer; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.btn:hover{border-color:var(--chart);}
.btn.amber{background:var(--amber); border-color:var(--amber); color:#1d1406;}
.btn[aria-pressed="true"]{background:var(--chart); border-color:var(--chart); color:#0d1a20;}
.more-wrap{text-align:center; margin:16px 0;}
.genres{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px;}
.genre{padding:14px; border-radius:8px; background:var(--tilebg, var(--s2)); display:flex; justify-content:space-between; align-items:baseline; font-family:var(--serif); font-weight:700; font-size:16px;}
.genre span{font-family:var(--ui); font-size:12px; color:rgba(236,231,220,.75); font-weight:600;}
.people{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px;}
.person{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:8px; background:var(--s1); border:1px solid var(--line);}
.person b{font-family:var(--serif);} .person span{color:var(--paper3); font-size:12.5px; white-space:nowrap;}

/* ---------- Scheda del film ---------- */
.film-head{display:grid; grid-template-columns:220px minmax(0, 1fr); gap:24px; align-items:start;}
@media (max-width:700px){ .film-head{grid-template-columns:minmax(0, 1fr);} .poster{max-width:240px;} }
.poster{aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:var(--tilebg, var(--s2)); position:relative; display:flex; align-items:flex-end; padding:14px;}
.poster img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.poster img ~ .tt{display:none;}   /* con la foto o la locandina, niente titolo né iniziali sopra */
.poster .tt{font-family:var(--serif); font-weight:700; font-size:22px; line-height:1.15; position:relative;}
.orig{font-family:var(--serif); font-style:italic; color:var(--paper2); font-size:17px; margin:-2px 0 8px;}
.facts{display:flex; flex-wrap:wrap; gap:6px 14px; color:var(--paper2); font-size:14px; margin-bottom:12px;} .facts a{color:var(--chart);}
.scores{display:flex; flex-wrap:wrap; gap:10px; margin:12px 0;}
.score{padding:10px 14px; border-radius:8px; background:var(--s1); border:1px solid var(--line); min-width:96px;}
.score b{display:block; font-family:var(--serif); font-size:24px; line-height:1.1;} .score span{font-size:12px; color:var(--paper3);}
.score.mp{border-color:var(--amber); background:rgba(233,162,59,.08);} .score.mp b{color:var(--amber2);}
.why{font-size:13px; color:var(--paper2); margin:4px 0 0;}
.marks{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.box{border:1px solid var(--line); border-radius:10px; background:var(--s1); margin:18px 0; overflow:hidden;}
.box h3{margin:0; padding:11px 14px; font-family:var(--serif); font-size:16.5px; border-bottom:1px solid var(--line);}
.box .in{padding:12px 14px;}
.kv{display:grid; grid-template-columns:150px minmax(0, 1fr); gap:6px 14px; font-size:14px;} .kv dt{color:var(--paper3);} .kv dd{margin:0;} .kv a{color:var(--chart);}
@media (max-width:560px){ .kv{grid-template-columns:minmax(0, 1fr); gap:2px;} .kv dd{margin-bottom:6px;} }
.crit-row{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:10px 14px; border-top:1px solid var(--line);} .crit-row:first-of-type{border-top:0;}
.crit-row b{min-width:150px;} .crit-row a{color:var(--chart); font-weight:600; margin-left:auto;}
.plot{font-family:var(--serif); font-size:16px; line-height:1.65; max-width:72ch;}
.note{font-size:12.5px; color:var(--paper3);}
.cast{display:flex; flex-wrap:wrap; gap:6px;} .cast a{padding:4px 10px; border-radius:14px; background:var(--s2); font-size:13.5px;}
.castgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px;}
.cm{display:flex; align-items:center; gap:11px; padding:8px 10px 8px 8px; border-radius:14px; background:var(--s2); min-width:0; border:1px solid transparent;}
.cm:hover{border-color:var(--line);}
.cm-ph{position:relative; width:46px; height:46px; border-radius:50%; overflow:hidden; background:var(--s3); flex:none; display:flex; align-items:center; justify-content:center;}
.cm-ph i{font-style:normal; font-weight:700; font-size:15px; color:var(--paper3); letter-spacing:-0.02em;}
.cm-ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.cm-ph img ~ i{display:none;}
.cm-t{min-width:0;} .cm-t b{display:block; font-weight:650; font-size:14.5px; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cm-t small{display:block; color:var(--paper3); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
html.tv .castgrid{grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));} html.tv .cm-ph{width:60px; height:60px;} html.tv .cm-t b{font-size:19px;} html.tv .cm-t small{font-size:16px;}
.bars{display:flex; flex-direction:column; gap:6px; max-width:560px;}
.barrow{display:grid; grid-template-columns:110px minmax(0, 1fr) 40px; gap:10px; align-items:center; font-size:13.5px;}
.barrow i{display:block; height:10px; border-radius:5px; background:var(--chart);} .barrow .v{text-align:right; color:var(--paper2);}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:60; background:var(--paper); color:var(--ink); padding:10px 16px; border-radius:20px; font-weight:600; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw;}
.toast.show{opacity:1;}
textarea.copy{width:100%; min-height:120px; font-size:11px; background:var(--s1); color:var(--paper); border:1px solid var(--line); border-radius:8px;}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#"><span class="rose" aria-hidden="true"></span><b>Atlante Serie TV</b></a>
    <form class="search" id="searchForm" role="search"><input id="q" type="search" placeholder="Cerca una serie, un attore…" aria-label="Cerca" autocomplete="off"></form>
    <nav class="nav" aria-label="Sezioni">
      <a href="#" data-nav="home">Esplora</a>
      <a href="#lista/capolavori" data-nav="lista">Capolavori</a>
      <a href="#attori" data-nav="attori">Attori</a>
      <a href="#liste" data-nav="liste">Le mie liste</a>
      <a href="#classifiche" data-nav="classifiche">Classifiche</a>
      <a href="#strumenti" data-nav="strumenti">Strumenti</a>
    </nav>
  </div>
</header>
<main id="view" aria-live="polite"><div class="status"><h1>Atlante Serie TV</h1><p>Carico gli indici della Videoteca…</p></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   Atlante Serie TV — enciclopedia personale delle serie.
   Legge gli indici della Videoteca (stesso sito, cartella superiore):
   IMDb, cast, Frusciante e Criticoni; e l'indice della critica.
   ===================================================================== */
const APP_VERSION = '1.0';
/* Copiate dalla Videoteca da build_serie.py: leggono l'indice delle serie e il cast esattamente come lei. */
let SERIES = null, SERIES_BY_ID = null, SERIES_STATE = 'idle', _seriesPromise = null, IMDB_INDEX = null;
let CAST_INDEX = null, CAST_STATE = 'idle', _castPromise = null;
const CRIT = null;   // niente Frusciante e Criticoni nelle serie
function critMatch(){ return null; }

function tvMove(dir){   // la selezione va all'elemento più vicino nella direzione della freccia
  const list = tvFocusables(), cur = list.includes(document.activeElement) ? document.activeElement : null;
  if(!cur){ const f = list.find(el=>el.closest('#view')) || list[0]; if(f){ f.focus({ preventScroll: true }); f.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } return f || null; }

async function wikiPosters(ids){
  const q = `SELECT ?imdb ?en ?it WHERE { VALUES ?imdb { ${ids.map(i=>'"' + i + '"').join(' ')} } ?f wdt:P345 ?imdb . `
    + `OPTIONAL { ?en schema:about ?f ; schema:isPartOf <https://en.wikipedia.org/> } OPTIONAL { ?it schema:about ?f ; schema:isPartOf <https://it.wikipedia.org/> } }`;
  const j = await jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q));
  const T = {}, tt = u => decodeURIComponent(String(u).split('/wiki/')[1] || '').replace(/_/g, ' ');
  ((j.results && j.results.bindings) || []).forEach(b=>{ const id = b.imdb && b.imdb.value; if(id && !T[id]) T[id] = { en: b.en ? tt(b.en.value) : '', it: b.it ? tt(b.it.value) : '' }; });
  const out = {};
  for(const lang of ['en', 'it']){
    const need = ids.filter(id=>!out[id] && T[id] && T[id][lang]); if(!need.length) continue;
    const got = await pageImages(lang, need.map(id=>T[id][lang])); need.forEach(id=>{ if(got[T[id][lang]]) out[id] = got[T[id][lang]]; });
  }
  const rest = ids.filter(id=>!out[id]);
  if(SEASON_POSTERS && rest.length){   // la voce della serie ha un logo: la locandina sta nella voce della prima (o seconda) stagione
    const qs = `SELECT ?imdb ?ord ?en WHERE { VALUES ?imdb { ${rest.map(i=>'"' + i + '"').join(' ')} } ?s wdt:P345 ?imdb . ?season p:P179 ?st . ?st ps:P179 ?s ; pq:P1545 ?ord . FILTER(?ord IN ("1", "2")) `
      + `?en schema:about ?season ; schema:isPartOf <https://en.wikipedia.org/> . }`;
    try{ const js = await jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(qs)), S = {};
      ((js.results && js.results.bindings) || []).sort((a, b)=>(a.ord.value > b.ord.value ? 1 : -1)).forEach(b=>{ const id = b.imdb.value; (S[id] = S[id] || []).push(tt(b.en.value)); });
      const titles = [...new Set(Object.values(S).flat())], got = await pageImages('en', titles);
      rest.forEach(id=>{ const hit = (S[id] || []).find(t=>got[t]); if(hit) out[id] = got[hit]; }); }catch(err){}
  }
  ids.forEach(id=>{ if(!out[id] && T[id]){ const l = LAND[T[id].en] || LAND[T[id].it]; if(l) out[id] = 'L:' + l; } });   // niente locandina: il logo, intero
  return out;
}
const isL = u => typeof u === 'string' && u.startsWith('L:'), unL = u => isL(u) ? u.slice(2) : u;
const landHTML = u => `<span class="tl-bg" style="background-image:url('${esc(unL(u))}')"></span><img class="tl" src="${esc(unL(u))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.classList.remove('has-l'); this.remove()">`;
function paintPoster(id){
  const u = WPOST.get(id);
  document.querySelectorAll(`[data-pid="${id}"]`).forEach(el=>{ el.removeAttribute('data-pid'); if(!u) return;
    if(isL(u) && (el.classList.contains('tile') || el.classList.contains('poster'))){ if(!el.querySelector('img')){ el.insertAdjacentHTML('afterbegin', landHTML(u)); el.classList.add('has-l'); } }
    else if(isL(u)){ const th = el.querySelector('.th'); if(th) th.outerHTML = `<img class="th thl" src="${esc(unL(u))}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`; }
    else if(el.classList.contains('tile')){ el.insertAdjacentHTML('afterbegin', `<img class="tp" src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.parentElement.classList.remove('has-p'); this.remove()">`); el.classList.add('has-p'); }
    else if(el.classList.contains('poster')){ if(!el.querySelector('img')) el.insertAdjacentHTML('afterbegin', `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`); }
    else { const th = el.querySelector('.th'); if(th) th.outerHTML = `<img class="th" src="${esc(u)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`; } });
}
const _pio = 'IntersectionObserver' in window ? new IntersectionObserver(en=>en.forEach(x=>{ if(x.isIntersecting){ _pio.unobserve(x.target); wantPoster(x.target.dataset.pid); } }), { rootMargin: '400px' }) : null;

/* ---------- Persone: biografia da Wikidata e Wikipedia, partendo dai loro serie più famosi (niente omonimi) ---------- */
const ROLE_P = { P170: 'Ideazione', P57: 'Regia', P161: 'Interprete', P58: 'Sceneggiatura', P86: 'Musiche', P344: 'Fotografia', P1040: 'Montaggio', P2554: 'Scenografia', P2515: 'Costumi', P162: 'Produzione' };
async function personFilms(qid){   // tutte le serie in cui la persona ha avuto un ruolo, con il codice IMDb
  const q = `SELECT ?imdb ?prop WHERE { VALUES ?prop { ${Object.keys(ROLE_P).map(p=>'wdt:' + p).join(' ')} } ?f ?prop wd:${qid} ; wdt:P345 ?imdb . }`;
  const j = await jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q)), out = {};
  ((j.results && j.results.bindings) || []).forEach(b=>{ const id = b.imdb && b.imdb.value, p = b.prop && b.prop.value.split('/').pop(); if(id && ROLE_P[p]) (out[id] = out[id] || []).includes(p) || out[id].push(p); });
  return out;
}
const fmtD = iso => { if(!iso) return ''; const [y, m, d] = iso.split('-'); if(!m || m === '00') return y; try{ return new Date(`${y}-${m}-${d === '00' ? '01' : d}T12:00:00`).toLocaleDateString('it-IT', d === '00' ? { month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long', year: 'numeric' }); }catch(e){ return y; } };
async function fetchPerson(name, films){
  const key = 'person3:' + normKey(name), c = await dget(key);
  if(c && Date.now() - c.at < 60 * 864e5) return c; if(navigator.onLine === false) return c;
  const out = { at: Date.now() }, k = normKey(name); let qid = '';
  const anchor = (films || []).slice().sort((a, b)=>b.v - a.v).slice(0, 3).map(e=>e.id);
  if(anchor.length){ try{
    const q = `SELECT ?p ?l WHERE { VALUES ?imdb { ${anchor.map(i=>'"' + i + '"').join(' ')} } ?f wdt:P345 ?imdb . { ?f wdt:P57 ?p } UNION { ?f wdt:P161 ?p } UNION { ?f wdt:P58 ?p } UNION { ?f wdt:P86 ?p } UNION { ?f wdt:P344 ?p } UNION { ?f wdt:P162 ?p } ?p rdfs:label ?l . FILTER(LANG(?l) IN ("it", "en")) }`;
    const j = await jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q));
    const hit = ((j.results && j.results.bindings) || []).find(b=>normKey(b.l.value) === k); if(hit) qid = hit.p.value.split('/').pop(); }catch(e){} }
  if(!qid){ try{ const sr = await jget(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(name)}&language=it&uselang=it&type=item&limit=6&format=json&origin=*`);
    const h = ((sr && sr.search) || []).find(x=>/regist|attor|attric|sceneggiat|compositor|fotografia|produttor|montator|scenograf|costumist|director|actor|actress|screenwriter|composer|cinematographer|producer|editor/i.test(x.description || '')); if(h) qid = h.id; }catch(e){} }
  if(!qid){ await dset(key, out); return out; }
  out.qid = qid;
  const ej = await jget(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=claims|sitelinks&format=json&origin=*`), e = (ej.entities || {})[qid] || {};
  const vals = p => (((e.claims || {})[p]) || []).map(c=>c.mainsnak && c.mainsnak.datavalue && c.mainsnak.datavalue.value).filter(Boolean);
  const t = v => v && v.time ? v.time.replace(/^\+/, '').slice(0, 10) : '';
  const img = vals('P18')[0]; if(img) out.photo = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(img) + '?width=400';
  out.born = t(vals('P569')[0]); out.died = t(vals('P570')[0]);
  const refs = { bp: vals('P19').slice(0, 1), dp: vals('P20').slice(0, 1), nat: vals('P27').slice(0, 2), occ: vals('P106').slice(0, 6), aw: vals('P166').slice(0, 10), nom: vals('P1411').slice(0, 6), sp: vals('P26').slice(0, 3) };
  Object.keys(refs).forEach(x=>{ refs[x] = refs[x].map(v=>v.id).filter(Boolean); });
  const ids = [...new Set(Object.values(refs).flat())].slice(0, 50); let labs = {};
  if(ids.length){ try{ labs = ((await jget(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids.join('|')}&props=labels&languages=it|en&format=json&origin=*`)).entities) || {}; }catch(err){} }
  const lab = q => { const x = labs[q] && labs[q].labels; return x ? ((x.it || x.en || {}).value || '') : ''; };
  out.f = {}; Object.entries(refs).forEach(([x, l])=>{ out.f[x] = l.map(lab).filter(Boolean); });
  out.nAw = vals('P166').length; out.nNom = vals('P1411').length;
  try{ out.films = await personFilms(qid); }catch(err){}
  for(const w of ['itwiki', 'enwiki']){ const sl = e.sitelinks && e.sitelinks[w]; if(!sl) continue;
    try{ const j = await jget(`https://${w.slice(0, 2)}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(sl.title.replace(/ /g, '_'))}`);
      if(j && j.extract){ out.wiki = { lang: w.slice(0, 2), text: j.extract, url: (j.content_urls && j.content_urls.desktop && j.content_urls.desktop.page) || '' }; if(!out.photo && j.thumbnail) out.photo = j.thumbnail.source; break; } }catch(err){} }
  await dset(key, out); return out;
}
function renderPersonOnline(name, d){

    return esc([...m.entries()].map(([x, n])=>n > 1 ? `${x} (${n})` : x).join(', ')) + (tot > a.length ? ` e altri ${tot - a.length}` : ''); };

    f.aw && f.aw.length ? ['Premi', list(f.aw, d.nAw)] : null, f.nom && f.nom.length ? ['Candidature', list(f.nom, d.nNom)] : null, f.sp && f.sp.length ? ['Coniuge', list(f.sp, f.sp.length)] : null].filter(Boolean);

}

/* ---------- 🆕 Novità: date di uscita da Wikidata (in Italia quando c'è) ---------- */
const NOVITA_TITLE = '🆕 Novità', NEW_SEASONS = true;
let NOVITA = null, SEASONS_NEW = [], SEASON_BY = new Map();
const today = () => new Date().toISOString().slice(0, 10);
function novitaBase(){ const y = new Date().getFullYear(); return BY_V.filter(e=>(parseInt(e.y, 10) || 0) >= y - 1 && e.v >= 1500); }
function novitaList(){
  const base = novitaBase(), t = today(), d = e => (NOVITA && NOVITA.get(e.id)) || '';
  return base.slice().sort((a, b)=>{ const da = d(a), db = d(b), ra = da && da <= t, rb = db && db <= t;
    if(ra !== rb) return ra ? -1 : 1; if(ra && rb && da !== db) return da < db ? 1 : -1;
    return (parseInt(b.y, 10) - parseInt(a.y, 10)) || b.v - a.v; });
}
async function fetchNovita(){
  const c = await dget('novita2');
  if(c && Date.now() - c.at < 864e5){ NOVITA = new Map(c.dates); SEASONS_NEW = (c.seasons || []).map(x=>Object.assign({}, x, { e: imdbEntry(x.id) })).filter(x=>x.e); SEASON_BY = new Map(SEASONS_NEW.map(x=>[x.id, x])); return; }
  if(navigator.onLine === false) return;
  const cand = novitaBase().slice(0, 150).map(e=>e.id), dates = new Map();
  if(cand.length){ try{
    const q = `SELECT ?imdb ?d ?pl WHERE { VALUES ?imdb { ${cand.map(i=>'"' + i + '"').join(' ')} } ?f wdt:P345 ?imdb . { ?f p:P577 ?st . ?st ps:P577 ?d . OPTIONAL { ?st pq:P291 ?pl } } UNION { ?f wdt:P580 ?d } }`;
    const j = await jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q)), it = new Map(), any = new Map();
    ((j.results && j.results.bindings) || []).forEach(b=>{ const id = b.imdb.value, dd = (b.d.value || '').slice(0, 10); if(!/^\d{4}-\d\d-\d\d$/.test(dd)) return;
      const isIt = b.pl && /Q38$/.test(b.pl.value); const m = isIt ? it : any; if(!m.has(id) || dd < m.get(id)) m.set(id, dd); });
    cand.forEach(id=>{ const dd = it.get(id) || any.get(id); if(dd) dates.set(id, dd); });   // la data italiana se c'è, altrimenti la prima uscita
  }catch(e){} }
  let seasons = [];
  if(NEW_SEASONS){ try{
    const since = new Date(Date.now() - 120 * 864e5).toISOString().slice(0, 10);
    const qs = `SELECT ?imdb ?ord ?d WHERE { ?season p:P179 ?st . ?st ps:P179 ?s ; pq:P1545 ?ord . ?season wdt:P580 ?d . FILTER(?d >= "${since}T00:00:00Z"^^xsd:dateTime && ?d <= NOW()) ?s wdt:P345 ?imdb . }`;
    const js = await jget('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(qs)), best = new Map();
    ((js.results && js.results.bindings) || []).forEach(b=>{ const id = b.imdb.value, dd = (b.d.value || '').slice(0, 10), o = parseInt(b.ord.value, 10) || 0; if(!imdbEntry(id)) return;
      const cur = best.get(id); if(!cur || dd > cur.d) best.set(id, { id, ord: o, d: dd }); });
    seasons = [...best.values()].sort((a, b)=>a.d < b.d ? 1 : -1);
  }catch(e){} }
  NOVITA = dates; SEASONS_NEW = seasons.map(x=>Object.assign({}, x, { e: imdbEntry(x.id) })); SEASON_BY = new Map(SEASONS_NEW.map(x=>[x.id, x]));
  dset('novita2', { at: Date.now(), dates: [...dates.entries()], seasons });
}

/* ---------- Le tue liste ---------- */
const LKEY = 'serie-liste';
let LISTE = (()=>{ try{ return JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; }catch(e){ return {}; } })();
const has = (id, k) => !!(LISTE[id] && LISTE[id][k]);
function setRating(id, n){ const r = LISTE[id] || {}; if(r.r === n) delete r.r; else { r.r = n; if(!r.v) r.v = Date.now(); delete r.d; } if(Object.keys(r).length) LISTE[id] = r; else delete LISTE[id]; try{ localStorage.setItem(LKEY, JSON.stringify(LISTE)); }catch(e){} }
function toggle(id, k){ const r = LISTE[id] || {}; if(r[k]) delete r[k]; else r[k] = Date.now(); if(k === 'v' && r.v && r.d) delete r.d; if(Object.keys(r).length) LISTE[id] = r; else delete LISTE[id];
  try{ localStorage.setItem(LKEY, JSON.stringify(LISTE)); }catch(e){ toast('Non riesco a salvare le liste in questo browser'); } }

/* ---------- Pezzi di interfaccia ---------- */
function badges(e){
  enrich(e); const b = [];
  if(e._mp) b.push('<span class="bd mp">✦ Capolavoro</span>');
  if(OWN.has(e.id)) b.push('<span class="bd own">✓ Videoteca</span>');
  const vd = (x, who) => x && x.s != null ? `<span class="bd ${x.s === 1 ? 'pos' : x.s === -1 ? 'neg' : 'mix'}" title="${who}: ${x.s === 1 ? 'positivo' : x.s === -1 ? 'negativo' : 'misto'}">🎙 ${who === 'Frusciante' ? 'F' : 'C'}</span>` : '';
  b.push(vd(e._f, 'Frusciante'), vd(e._c, 'Criticoni'));
  if(LISTE[e.id] && LISTE[e.id].r) b.push(`<span class="bd mp">★ ${LISTE[e.id].r}</span>`);
  if(has(e.id, 'v')) b.push('<span class="bd">vista</span>'); else if(has(e.id, 'd')) b.push('<span class="bd">da vedere</span>'); if(has(e.id, 'p')) b.push('<span class="bd">♥</span>');

}

function paged(id, items, render, size){   // elenchi lunghi a pagine

const SORTS = { fama: ['Le più famose', (a, b)=>b.v - a.v], voto: ['I più votati', (a, b)=>b._br - a._br], punteggio: ['Punteggio dell\'Atlante', (a, b)=>b._s - a._s || b.v - a.v], recenti: ['Dalla più recente', (a, b)=>(b.y || '0').localeCompare(a.y || '0')], anno: ['Dalla più vecchia', (a, b)=>(a.y || '9').localeCompare(b.y || '9')] };

let _db = null;
function db(){ if(_db) return _db; _db = new Promise(res=>{ try{ const r = indexedDB.open('atlante-serie-tv', 1); r.onupgradeneeded = () => r.result.createObjectStore('det'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch(e){ res(null); } }); return _db; }
async function dget(k){ const d = await db(); if(!d) return null; return new Promise(res=>{ try{ const q = d.transaction('det').objectStore('det').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }catch(e){ res(null); } }); }
async function dset(k, v){ const d = await db(); if(!d) return; try{ d.transaction('det', 'readwrite').objectStore('det').put(v, k); }catch(e){} }
async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error('http' + r.status); return r.json(); }

const CKEY = 'serie-classifiche';

const sizeLbl = n => n ? 'Top ' + n : 'Libera';
function addToRanking(cid, id){
  const c = CLS.find(x=>x.id === cid); if(!c) return false;
  if(c.items.includes(id)){ toast('È già in questa classifica'); return false; }
  if(c.size && c.items.length >= c.size){ toast(`La classifica è piena (${sizeLbl(c.size)}): togli una serie per aggiungerne un altro`); return false; }
  const e = imdbEntry(id); if(c.genre && e && !genres(e).includes(c.genre)){ toast(`Questa classifica è solo per il genere ${c.genre}`); return false; }

/* ---------- 📋 Importa un elenco: una classifica letta altrove diventa una tua classifica ---------- */
let _titleMap = null;
function titleMap(){   // titolo normalizzato → schede, costruita una volta sola
  if(_titleMap) return _titleMap;
  _titleMap = new Map();
  const add = (t, e) => { const k = normKey(t || ''); if(!k) return; const l = _titleMap.get(k); if(l){ if(!l.includes(e)) l.push(e); } else _titleMap.set(k, [e]); };
  ALL.forEach(e=>{ add(e.it, e); add(e.en, e); String(e.al || '').split('~').forEach(a=>add(a, e)); });   // anche i titoli alternativi
  return _titleMap;
}
function matchLine(line){
  const raw = String(line || '').trim(), nm = raw.match(/^\s*(?:n\.?\s*|#)?(\d{1,3})\s*[.)\-:°º]?\s+/i), num = nm ? +nm[1] : 0;

  const ym = t.match(/\((\d{4})/), year = ym ? +ym[1] : 0;
  t = t.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, ' ').replace(/\s+[-–—]\s+\d{4}.*$/, '').replace(/\s+/g, ' ').trim();   // tutte le precisazioni tra parentesi
  if(!t || /^(i'?ve seen|i want|seen it|see it|explore the list)/i.test(t)) return null;
  const M = titleMap(), get = x => { const k = normKey(x || ''); return k ? M.get(k) : null; };
  let c = get(t) || get(t.replace(/^(the|il|lo|la|i|gli|le|l')\s*/i, '')) || get(t.replace(/\s*&\s*/g, ' and ')) || get(t.replace(/\s*&\s*/g, ' e '))   // "&" scritto per esteso
    || (t.includes(':') ? get(t.split(':')[0]) : null);                                              // "Twin Peaks: The Return" → "Twin Peaks" (poi decide l'anno)
  if(!c || !c.length){ const k = normKey(t); if(k.length >= 8){ c = []; for(const [key, l] of M){ if(key.startsWith(k + ' ')) c.push(...l); } } }   // titolo più lungo nell'indice ("… with Tim Robinson")
  if(!c || !c.length) return { title: t, e: null, num };
  if(year){ const y = c.filter(e=>Math.abs((parseInt(e.y, 10) || 0) - year) <= 1); if(y.length) c = y; }   // l'anno separa gli omonimi
  return { title: t, e: c.slice().sort((a, b)=>(b.v || 0) - (a.v || 0))[0], num };
}
function csvRows(text){   // CSV semplice: virgole o punto e virgola, virgolette per i titoli con la virgola
  const first = String(text).split(/\r?\n/)[0] || '', sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){ const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true; else if(ch === sep){ row.push(cell); cell = ''; } else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch; }
  if(cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
function csvToLines(text){   // da CSV a righe "1. Titolo (anni)"; se non è un CSV, il testo resta com'è
  const t = String(text || '').replace(/^\uFEFF/, ''), first = t.split(/\r?\n/)[0] || '';
  if(!/[,;]/.test(first)) return t;
  const rows = csvRows(t); if(rows.length < 2 || rows[0].length < 2) return t;
  const h = rows[0].map(c=>normKey(c)), find = re => h.findIndex(c=>re.test(c));
  let ti = find(/^(title|titolo|serie|serie|show|name|nome)/), ri = find(/^(rank|pos|posizione|numero|n|#)$/), yi = find(/^(year|years|anno|anni)/), body = rows.slice(1);
  if(ti < 0){ body = rows; if(/^\d+$/.test(rows[0][0].trim())){ ri = 0; ti = 1; yi = rows[0].length > 2 ? 2 : -1; } else { ti = 0; ri = -1; yi = rows[0].length > 1 && /\d{4}/.test(rows[0][1]) ? 1 : -1; } }
  return body.map(r=>{ const title = (r[ti] || '').trim(); if(!title) return ''; const rank = ri >= 0 ? (r[ri] || '').trim() : '', yr = yi >= 0 ? (r[yi] || '').trim() : '';
    return `${/^\d+$/.test(rank) ? rank + '. ' : ''}${title}${yr ? ' (' + yr + ')' : ''}`; }).filter(Boolean).join('\n');
}
function importList(name, text, src, pin){
  text = csvToLines(text);
  const lines = String(text || '').split(/\n+/).map(x=>x.trim()).filter(x=>x && !/^(fonte|source)\b/i.test(x));
  const items = [], miss = [], got = lines.map(matchLine).filter(Boolean);
  if(got.length && got.filter(m=>m.num).length >= got.length * 0.6) got.sort((a, b)=>(a.num || 999) - (b.num || 999));   // righe numerate (anche da due colonne): conta il numero
  got.forEach(m=>{ if(m.e){ if(!items.includes(m.e.id)) items.push(m.e.id); } else miss.push(m.title); });
  if(!items.length) return { ok: false, miss };
  const c = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: name || 'Classifica importata', size: 0, genre: '', items, src: src || '', miss, pin: pin !== false, created: Date.now(), updated: Date.now() };
  CLS.push(c); saveCls(); return { ok: true, c, miss };
}

  if(k === 'attori') return viewActors();
  if(k === 'attore') return viewActor(arg);
  if(k === 'cerca') return viewSearch(arg);
  if(k === 'liste') return viewLists(arg);
  if(k === 'classifiche') return viewRankings();
  if(k === 'classifica') return viewRanking(arg);
  if(k === 'persona') return viewPersona(arg);
  if(k === 'strumenti') return viewTools();
  viewHome();
}

}
