plugins { id 'com.android.application' }

// L'indirizzo degli Atlanti lo passa il workflow (-PbaseUrl=https://NOME.github.io/REPOSITORY/).
def baseUrl = (project.findProperty('baseUrl') ?: 'https://example.github.io/videoteca/').toString()
if (!baseUrl.endsWith('/')) baseUrl = baseUrl + '/'
// Ogni costruzione ha un numero più alto: Android la installa sopra la precedente.
def vcode = (project.findProperty('vc') ?: '1').toString().toInteger()

android {
    namespace 'it.atlante.app'
    compileSdk 34
    defaultConfig {
        minSdk 21            // Android 5: anche il Sony del 2017 (Android 8) e i telefoni più vecchi
        targetSdk 34
        versionCode vcode
        versionName '1.0.' + vcode
        buildConfigField 'String', 'BASE_URL', '"' + baseUrl + '"'
    }
    buildFeatures { buildConfig true }
    // Due app separate: ognuna con il proprio nome di pacchetto, quindi icona, file e dati distinti.
    flavorDimensions 'atlante'
    productFlavors {
        cinema { dimension 'atlante'; applicationId 'it.atlante.cinema'; buildConfigField 'String', 'APP_PATH', '"atlante/"' }
        serie  { dimension 'atlante'; applicationId 'it.atlante.serie';  buildConfigField 'String', 'APP_PATH', '"serie/"' }
    }
    // Firma fissa e NON segreta: serve solo a far installare gli aggiornamenti sopra la versione precedente.
    // Va bene per un'app personale installata a mano; non per il Play Store.
    signingConfigs {
        release {
            storeFile file('../keystore/atlante.jks')
            storePassword 'atlante-app'
            keyAlias 'atlante'
            keyPassword 'atlante-app'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
}
